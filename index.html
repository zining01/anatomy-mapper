]}],bc=["faceAnterior","headRight","headLeft","headPosterior"];var an={"vii-temporal":{name:"Temporal (frontal) branch of facial n.",layer:"motor",risk:"high",summary:"Motor to frontalis and upper orbicularis oculi. The most commonly injured motor nerve in facial skin surgery.",landmark:"Pitanguy's line: from 0.5 cm below the tragus to 1.5 cm above the lateral eyebrow. Its 2\u20135 rami cross the middle third of the zygomatic arch. Danger zone (Seckel zone 2): the triangle between that line (taken to 2 cm above the brow), the zygomatic arch and the lateral orbital rim.",depth:"Leaves the parotid deep to the SMAS, then becomes very superficial: over the arch and in the temple it runs on the undersurface of the thin SMAS / superficial temporal (temporoparietal) fascia with little fat above it, and enters frontalis from its deep surface about 1 cm above the lateral brow.",injury:"Ipsilateral brow ptosis, loss of forehead rhytids and inability to raise the brow. Few cross-connections with other branches, so transection is usually permanent.",avoid:"Undermine in the superficial subcutaneous fat, above the superficial temporal fascia; use blunt dissection and bipolar cautery. Counsel before surgery when tumour extends deep here. Local anaesthetic alone can cause a brow droop that lasts a few hours."},"vii-zygomatic":{name:"Zygomatic branches of facial n.",layer:"motor",risk:"moderate",summary:"Motor to orbicularis oculi (eye closure) and the zygomatic lip elevators.",landmark:"Leave the anterosuperior parotid and cross the body of the zygoma towards the lateral canthus.",depth:"Deep to the SMAS on the parotid\u2013masseteric fascia; they enter their muscles from the deep surface. Exposed once anterior to the parotid, where the fat is thin over the malar eminence.",injury:"Weak eye closure (lagophthalmos, exposure keratopathy) and weak smile. Rich arborisation with buccal branches means most deficits recover.",avoid:"Stay in subcutaneous fat above the SMAS. Medial to a vertical line through the lateral canthus the branches are small and heavily interconnected."},"vii-buccal":{name:"Buccal branches of facial n.",layer:"motor",risk:"moderate",summary:"Motor to buccinator, upper-lip elevators and orbicularis oris. Travel with the parotid duct.",landmark:"Leave the anterior parotid and run forwards across masseter along the line from the tragus to the mid upper lip.",depth:"Deep to the SMAS on the masseteric fascia, alongside Stensen's duct; over the buccal fat pad anterior to masseter.",injury:"Weak smile and upper-lip elevation, food pocketing in the cheek. Usually temporary because of cross-innervation with zygomatic branches.",avoid:"Keep undermining in the subcutaneous plane above the SMAS; be wary of deep excisions anterior to the parotid."},"zone-midcheek":{name:"Mid-cheek zone \u2014 zygomatic & buccal branches",layer:"danger",risk:"moderate",summary:"Where the zygomatic and buccal branches (and the parotid duct) leave the protection of the parotid.",landmark:"Seckel zone 4: the triangle between the malar eminence, the posterior border of the mandibular angle and the oral commissure, anterior to the parotid.",depth:"Branches lie deep to the SMAS on the masseteric fascia and buccal fat pad, with Stensen's duct.",injury:"Weak smile, weak eye closure or cheek food pocketing; a cut duct causes a sialocele or salivary fistula. Nerve deficits usually recover through cross-connections.",avoid:"Undermine in subcutaneous fat above the SMAS. If the SMAS or masseteric fascia has to be breached, look for the duct and nerve branches."},"vii-marginal":{name:"Marginal mandibular branch of facial n.",layer:"motor",risk:"high",summary:"Motor to depressor anguli oris, depressor labii inferioris and mentalis.",landmark:"Leaves the parotid tail near the angle of the mandible and runs along the lower border of the mandible. Posterior to the facial artery it lies below the border in about 1 in 5 people (up to 1\u20132 cm, more with neck extension); anterior to the artery it is above the border. It crosses superficial to the facial artery and vein at the anterior edge of masseter, where the pulse is felt. Danger zone (Seckel zone 3): a 2 cm-radius circle on the mid-mandible 2 cm behind the oral commissure.",depth:"Deep to platysma and the investing fascia. Platysma is thin or absent here in older patients, so only skin and a little fat may cover the nerve as it crosses the facial vessels.",injury:"The lower lip on that side fails to depress and evert: asymmetric smile and full-denture grimace, drooling. Few cross-connections, so injury is often permanent.",avoid:"Undermine in the fat above platysma. Remember that turning the head away and extending the neck draws the nerve lower into the submandibular area."},"vii-cervical":{name:"Cervical branch of facial n.",layer:"motor",risk:"low",summary:"Motor to platysma.",landmark:"Leaves the parotid tail and descends behind the angle of the mandible into the neck.",depth:"On the deep surface of platysma.",injury:'Minor. Platysmal weakness can mimic a marginal mandibular palsy ("pseudo-paralysis"), but mentalis still works and it recovers.',avoid:"Stay above platysma."},"vii-trunk":{name:"Facial n. \u2014 main trunk",layer:"motor",risk:"high",summary:"Leaves the stylomastoid foramen and enters the parotid, dividing into temporofacial and cervicofacial divisions.",landmark:"Deep to the earlobe, about 1 cm deep and anteroinferior to the tragal pointer, between the mastoid tip and the ramus.",depth:"Deep in adults, protected by the mastoid, the parotid and its fascia. In children under about 5 years the mastoid is undeveloped and the trunk is superficial just behind the lobule.",injury:"Complete hemifacial paralysis.",avoid:"Take care with deep excisions below the earlobe and over the mastoid tip, and with any post-auricular surgery in young children."},"xi-accessory":{name:"Spinal accessory n. (CN XI) \u2014 Erb's point",layer:"motor",risk:"high",summary:"Motor to trapezius. Crosses the posterior triangle of the neck just under the skin.",landmark:"Erb's point: join the angle of the mandible to the mastoid tip; from the midpoint of that line drop 6 cm vertically to the posterior border of sternocleidomastoid (about the middle of the muscle's posterior border). The nerve emerges within 1\u20132 cm above this point and runs obliquely down and back across the posterior triangle to enter trapezius about 5 cm above the clavicle. The great auricular, lesser occipital, transverse cervical and supraclavicular nerves fan out from the same point.",depth:"Very superficial: skin, a thin layer of fat and the investing layer of deep cervical fascia. Platysma does not cover most of the posterior triangle.",injury:"Trapezius paralysis: shoulder droop, winged scapula, inability to abduct the arm above the horizontal, chronic shoulder pain.",avoid:"Keep dissection in the superficial fat and use blunt spreading. Treat cysts, lipomas and node biopsies in the posterior triangle with the same respect as skin cancers."},"v1-supraorbital":{name:"Supraorbital n. (V1)",layer:"sensory",risk:"moderate",summary:"Sensation to the upper eyelid, forehead and scalp back to the vertex.",landmark:"Supraorbital notch or foramen on the orbital rim in the mid-pupillary line, about 2.5 cm from the midline (palpable). The supraorbital, infraorbital and mental foramina lie on roughly the same vertical line. Seckel zone 5 is a 1.5 cm circle centred here, which also takes in the supratrochlear nerve.",depth:"Deep to corrugator and frontalis at the rim. The superficial (medial) division pierces frontalis and runs in the subcutaneous fat to the anterior scalp; the deep (lateral) division runs between galea and periosteum just medial to the temporal crest to reach the frontoparietal scalp.",injury:"Numbness or dysaesthesia of the forehead and scalp back to the vertex; sometimes neuroma pain.",avoid:"Vertical (or oblique) incisions on the forehead spare the nerve; long horizontal incisions down to muscle, and deep undermining near the temporal crest, divide it. Warn patients about scalp numbness behind forehead wounds.",block:"0.5\u20131 mL just above the rim at the notch (mid-pupillary line), on to periosteum. Carry the needle 1 cm medially to add the supratrochlear nerve."},"v1-supratrochlear":{name:"Supratrochlear n. (V1) & artery",layer:"sensory",risk:"moderate",summary:"Sensation to the medial forehead and medial upper eyelid. Its artery is the pedicle of the paramedian forehead flap.",landmark:"Leaves the superomedial orbit at the medial end of the brow, 1.7\u20132.2 cm from the midline (about 1 cm medial to the supraorbital notch; close to a vertical line through the medial canthus).",depth:"Passes through or under corrugator, then pierces frontalis to become subcutaneous about 1\u20132 cm above the rim. The artery follows the same course and is subcutaneous in the upper forehead.",injury:"Medial forehead numbness. Dividing the artery sacrifices the pedicle for a paramedian forehead flap on that side.",avoid:"Record glabellar and medial-brow scars when planning a forehead flap; Doppler the pedicle if in doubt.",block:"0.5 mL at the junction of the brow and the nasal root, or extend a supraorbital block medially."},"v1-infratrochlear":{name:"Infratrochlear n. (V1)",layer:"sensory",risk:"low",summary:"Sensation to the medial canthus, nasal root and upper sidewall.",landmark:"Leaves the orbit just above the medial canthal tendon.",depth:"Subcutaneous over the medial canthal tendon.",injury:"Minor numbness.",block:"0.5 mL just above the medial canthus, along the upper nasal sidewall. With the infraorbital and external nasal blocks this anaesthetises the whole nose."},"v1-external-nasal":{name:"External nasal n. (anterior ethmoidal, V1)",layer:"sensory",risk:"low",summary:"Sensation to the lower dorsum, tip and upper columella.",landmark:"Emerges between the nasal bone and the upper lateral cartilage (at the rhinion), 6\u201310 mm from the midline, and runs down to the tip.",depth:"Deep to nasalis, on the perichondrium.",injury:"Numb nasal tip; cold intolerance.",block:"0.5 mL on each side of the dorsum at the bone\u2013cartilage junction. Needed for nasal-tip anaesthesia, which an infraorbital block alone does not give."},"v2-infraorbital":{name:"Infraorbital n. (V2) & artery",layer:"sensory",risk:"moderate",summary:"Sensation to the lower eyelid, medial cheek, nasal sidewall and ala, and upper lip.",landmark:"Infraorbital foramen, 0.7\u20131 cm below the infraorbital rim in the mid-pupillary line. Seckel zone 6 is a 1.5 cm circle centred here.",depth:"Deep, under levator labii superioris and over levator anguli oris; branches fan out superficially to the lid, nose and lip.",injury:"Numb upper lip, cheek and side of nose.",avoid:"Only at risk with deep excisions or deep undermining of the medial cheek.",block:"Intra-oral: retract the lip and pass the needle through the mucosa above the canine or first premolar towards the foramen, 1\u20132 mL. Percutaneous: just lateral to the ala, aiming up towards the foramen. Keep a finger on the rim to protect the globe."},"v2-zygomaticofacial":{name:"Zygomaticofacial n. (V2)",layer:"sensory",risk:"low",summary:"Sensation to the skin over the malar eminence.",landmark:"Small foramen on the body of the zygoma, below and lateral to the lateral orbital rim.",injury:"A small numb patch on the cheek prominence.",block:"0.5 mL over the malar eminence, just inferolateral to the orbital rim."},"v2-zygomaticotemporal":{name:"Zygomaticotemporal n. (V2)",layer:"sensory",risk:"low",summary:"Sensation to the anterior temple.",landmark:"Pierces the temporalis fascia about 1 cm behind the lateral orbital rim, at the level of the lateral canthus or just above.",injury:"Numb anterior temple.",block:"1 mL behind the lateral orbital rim, on to the bone of the temporal fossa."},"v3-mental":{name:"Mental n. (V3)",layer:"sensory",risk:"moderate",summary:"Sensation to the lower lip (skin and mucosa) and chin.",landmark:"Mental foramen, below the second premolar in the mid-pupillary line, midway between the alveolar margin and the lower border of the mandible (closer to the alveolar margin in the edentulous jaw). Seckel zone 7 is a 1.5 cm circle centred here.",depth:"Emerges deep to depressor anguli oris; its branches then run up superficially under the mucosa of the lower lip, where they can be seen through it.",injury:"Numb lower lip and chin: drooling, lip biting.",avoid:"At risk with deep excisions on the lateral chin and with mucosal surgery of the lower lip.",block:"Intra-oral: 1 mL through the mucosa of the lower sulcus at the second premolar. Percutaneous: over the foramen. Bilateral blocks are needed for the central lip."},"v3-auriculotemporal":{name:"Auriculotemporal n. (V3)",layer:"sensory",risk:"low",summary:"Sensation to the temple, the anterosuperior auricle, tragus and part of the ear canal.",landmark:"Ascends just in front of the tragus with the superficial temporal vessels (the nerve is posterior to the artery).",depth:"In the superficial temporal fascia with the vessels.",injury:"Numbness of the temple and upper ear.",block:"1\u20132 mL just anterior to the tragus and helical root, aspirating first (superficial temporal vessels)."},"c-great-auricular":{name:"Great auricular n. (C2\u2013C3)",layer:"sensory",risk:"moderate",summary:"Sensation to the lower two-thirds of the ear, the lobule, and skin over the parotid, angle of the mandible and mastoid.",landmark:"Rounds the posterior border of sternocleidomastoid at Erb's point and climbs across the muscle towards the earlobe. It crosses the mid-belly of the muscle 6.5 cm below the ear canal (McKinney's point; Seckel zone 1), about 1 cm behind and parallel to the external jugular vein.",depth:"On the fascia of sternocleidomastoid, covered only by skin, fat and \u2014 in its anterior part \u2014 thin platysma / SMAS.",injury:"Numb earlobe and lower ear; painful neuroma.",avoid:"Undermine in the superficial fat over sternocleidomastoid and below the lobule.",block:"Infiltrate over the mid-belly of sternocleidomastoid 6.5 cm below the canal, or ring-block the base of the ear."},"c-lesser-occipital":{name:"Lesser occipital n. (C2)",layer:"sensory",risk:"low",summary:"Sensation to the scalp behind the ear and the upper cranial surface of the auricle.",landmark:"From Erb's point it follows the posterior border of sternocleidomastoid up to the mastoid area.",depth:"Subcutaneous once it reaches the scalp.",injury:"Numbness behind the ear.",block:"Infiltrate along the posterior border of sternocleidomastoid at the level of the mastoid tip."},"c-transverse-cervical":{name:"Transverse cervical n. (C2\u2013C3)",layer:"sensory",risk:"low",summary:"Sensation to the anterior neck.",landmark:"From Erb's point it runs horizontally forwards across sternocleidomastoid, deep to the external jugular vein.",depth:"Deep to platysma.",injury:"Numbness of the anterior neck."},"c-supraclavicular":{name:"Supraclavicular nn. (C3\u2013C4)",layer:"sensory",risk:"low",summary:"Sensation to the lower neck, the skin over the clavicle, upper chest and shoulder.",landmark:"Descend from Erb's point across the posterior triangle and over the clavicle as medial, intermediate and lateral branches.",depth:"Deep to platysma, becoming subcutaneous above the clavicle.",injury:"Numbness over the clavicle and shoulder; occasionally a tender neuroma under a bra or bag strap."},"c-greater-occipital":{name:"Greater occipital n. (C2)",layer:"sensory",risk:"low",summary:"Sensation to the posterior scalp up to the vertex.",landmark:"Becomes subcutaneous on the superior nuchal line about one-third of the way from the external occipital protuberance to the mastoid (2.5\u20133 cm from the midline), just medial to the occipital artery pulse.",depth:"Pierces the trapezius aponeurosis, then runs in the subcutaneous tissue of the scalp above the galea.",injury:"Numbness or neuralgia of the posterior scalp.",block:"2\u20133 mL fanned just medial to the occipital artery pulse on the superior nuchal line."},"a-sta":{name:"Superficial temporal a.",layer:"vessels",risk:"moderate",summary:"Terminal branch of the external carotid; supplies the temple, forehead and scalp.",landmark:"Pulse just in front of the tragus, over the root of the zygomatic arch. Divides about 2 cm above the arch into a frontal (anterior) branch that crosses the temple towards the lateral forehead and a parietal branch that runs up into the scalp.",depth:"Within the superficial temporal (temporoparietal) fascia \u2014 just under the subcutaneous fat. The temporal branch of the facial nerve runs below and in front of the frontal branch, in the same layer.",injury:"Brisk arterial bleeding; a partly divided vessel can form a pseudoaneurysm.",avoid:"Ligate rather than cauterise when cut. Use the frontal branch as a guide: dissection kept above the vessel's plane is above the nerve."},"a-facial":{name:"Facial a.",layer:"vessels",risk:"moderate",summary:"Main arterial supply to the lower and mid face.",landmark:"Crosses the lower border of the mandible at the anterior edge of masseter (palpable pulse), with the facial vein behind it and the marginal mandibular nerve crossing over it. Runs a tortuous course to about 1.5 cm lateral to the oral commissure, gives off the labial arteries, then follows the melolabial fold to the alar base.",depth:"Deep to platysma, risorius and the zygomatic muscles; superficial to buccinator and the mandible.",injury:"Brisk bleeding.",avoid:"Ligate with suture. The pulse marks where the marginal mandibular nerve is at its most exposed."},"a-angular":{name:"Angular a.",layer:"vessels",risk:"moderate",summary:"Continuation of the facial artery beside the nose; anastomoses with the dorsal nasal branch of the ophthalmic artery.",landmark:"Runs up the alar-facial and nasofacial sulcus to the medial canthus. Gives the lateral nasal artery to the ala and tip.",depth:"Within or just deep to levator labii superioris alaeque nasi; superficial near the medial canthus.",injury:"Bleeding in medial-cheek, sidewall and medial-canthal surgery.",avoid:"Expect it when undermining across the nasofacial sulcus. Its perforators supply melolabial and dorsal nasal flaps."},"a-labial":{name:"Superior & inferior labial aa.",layer:"vessels",risk:"moderate",summary:"Encircle the mouth; the pedicle of lip-switch (Abbe, Estlander) flaps.",landmark:"Arise from the facial artery lateral to the commissure and run tortuously in each lip at about the level of the vermilion\u2013cutaneous junction.",depth:"Between orbicularis oris and the mucosa (posterior third of the lip), so they are met only in full-thickness or deep muscle excisions.",injury:"Brisk bleeding from both cut ends.",avoid:"In wedge excisions, compress the lip between finger and thumb (or use a chalazion clamp) and ligate both ends."},"a-supraorbital":{name:"Supraorbital a.",layer:"vessels",risk:"low",summary:"Branch of the ophthalmic artery; runs with the supraorbital nerve to the forehead and scalp.",landmark:"Supraorbital notch, mid-pupillary line.",depth:"Deep to frontalis at the rim, then superficial.",injury:"Bleeding."},"a-dorsal-nasal":{name:"Dorsal nasal a.",layer:"vessels",risk:"low",summary:"Terminal branch of the ophthalmic artery; supplies the nasal root and dorsum.",landmark:"Emerges above the medial canthal tendon and runs down the side of the dorsum, joining the angular artery.",depth:"Subcutaneous / within the nasal SMAS.",injury:"Bleeding.",avoid:"With the angular artery it is the pedicle of the dorsal nasal (Rieger) flap \u2014 keep the medial-canthal base of that flap intact."},"a-occipital":{name:"Occipital a.",layer:"vessels",risk:"low",summary:"Supplies the posterior scalp.",landmark:"Reaches the scalp between the attachments of trapezius and sternocleidomastoid, about 4 cm from the midline, just lateral to the greater occipital nerve; tortuous ascent towards the vertex.",depth:"Subcutaneous, above the galea.",injury:"Brisk scalp bleeding \u2014 vessels are held open by the fibrous septa.",avoid:"Suture-ligate scalp vessels; cautery often fails."},"a-posterior-auricular":{name:"Posterior auricular a.",layer:"vessels",risk:"low",summary:"Supplies the back of the ear and mastoid scalp.",landmark:"Runs up in the postauricular sulcus.",depth:"Subcutaneous.",injury:"Bleeding.",avoid:"It nourishes postauricular flaps and the cranial surface of the ear."},"v-external-jugular":{name:"External jugular v.",layer:"vessels",risk:"moderate",summary:"Large superficial vein of the lateral neck.",landmark:"Runs from behind the angle of the mandible obliquely across sternocleidomastoid to the mid-clavicle. The great auricular nerve runs parallel about 1 cm behind it.",depth:"Superficial to sternocleidomastoid, deep to platysma.",injury:"Bleeding; air embolism is possible with a large open vein low in the neck.",avoid:"Stay above platysma; ligate if entered."},parotid:{name:"Parotid gland",layer:"glands",risk:"moderate",summary:"Shields the facial nerve branches; contains first-echelon lymph nodes for the forehead, temple, cheek, ear and anterior scalp.",landmark:"From the zygomatic arch to the angle of the mandible (the tail may extend below the angle and the earlobe), and from the tragus and sternocleidomastoid forwards over the back of masseter.",depth:"Under skin, fat and the SMAS, inside the parotid fascia.",injury:"Breaching the capsule can cause a sialocele or salivary fistula.",avoid:"Deep tumour here may be parotid or nodal involvement \u2014 image and involve head and neck surgery."},"parotid-duct":{name:"Parotid (Stensen's) duct",layer:"glands",risk:"moderate",summary:"Carries saliva from the parotid to the mouth; travels with the buccal branches of the facial nerve.",landmark:"The middle third of a line from the tragus to the middle of the upper lip, about a fingerbreadth below the zygomatic arch. It crosses masseter, turns in at the muscle's anterior border and pierces buccinator to open opposite the upper second molar.",depth:"Deep to the SMAS on the masseteric fascia.",injury:"Sialocele or salivary\u2013cutaneous fistula.",avoid:"If the duct may have been cut, cannulate the papilla from inside the mouth to check. A divided duct should be repaired over a stent \u2014 involve the appropriate specialty."},lacrimal:{name:"Lacrimal canaliculi & medial canthal tendon",layer:"glands",risk:"moderate",summary:"Tear drainage from the puncta to the lacrimal sac.",landmark:"The puncta sit on the lid margins 5\u20136 mm lateral to the medial canthus. Each canaliculus runs 2 mm vertically and then about 8 mm medially within the lid margin to the common canaliculus and the sac, which lies behind the medial canthal tendon.",depth:"Just beneath the skin of the lid margin, within orbicularis.",injury:"Epiphora. Dividing the medial canthal tendon lets the canthus drift laterally (telecanthus).",avoid:"For defects of the lid margin medial to the punctum, probe the canaliculus; a cut canaliculus is repaired over a silicone stent (oculoplastic surgery)."},"b-supraclavicular":{name:"Supraclavicular fossa",layer:"danger",risk:"moderate",summary:"Apex of the lung, subclavian vessels and brachial plexus lie deep to a thin floor.",landmark:"The hollow above the middle third of the clavicle, between sternocleidomastoid and trapezius.",depth:"The external jugular vein and supraclavicular nerves are superficial; plexus, vessels and pleura lie beneath the deep fascia and scalene fat pad.",injury:"Bleeding, pneumothorax (deep needle or excision), plexus injury.",avoid:"Keep excisions and needles superficial; inject parallel to the skin."},"b-axilla":{name:"Axilla",layer:"danger",risk:"moderate",summary:"Axillary vessels, brachial plexus and nodes within the axillary fat.",landmark:"Neurovascular bundle runs along the lateral wall, palpable against the humerus.",depth:"Beneath the axillary fascia. The intercostobrachial nerve crosses the axillary fat more superficially.",injury:"Numb medial upper arm (intercostobrachial nerve); lymphocele after deep excision.",avoid:"Stay above the axillary fascia. Closing with the arm abducted avoids a tethering scar."},"b-antecubital":{name:"Antecubital fossa",layer:"danger",risk:"moderate",summary:"Superficial veins and cutaneous nerves; brachial artery and median nerve beneath the bicipital aponeurosis.",landmark:"Brachial pulse and median nerve are medial to the biceps tendon.",depth:"Median cubital, cephalic and basilic veins with the medial and lateral antebrachial cutaneous nerves lie in the subcutaneous fat. The artery and median nerve are protected only by the thin bicipital aponeurosis.",injury:"Bleeding; numbness or neuroma of the forearm skin.",avoid:"Superficial undermining. Orient scars away from the flexion crease or break them up to prevent contracture."},"b-ulnar-elbow":{name:"Ulnar n. at the elbow",layer:"danger",risk:"high",summary:"Runs in the cubital tunnel behind the medial epicondyle with almost no soft-tissue cover.",landmark:'The groove between the medial epicondyle and the olecranon (the "funny bone").',depth:"Under skin and a thin fascial roof.",injury:"Numb little and ulnar ring finger, weak grip and pinch, clawing.",avoid:"Superficial dissection only over the posteromedial elbow."},"b-radial-sensory":{name:"Superficial branch of radial n.",layer:"danger",risk:"moderate",summary:"Sensation to the dorsum of the thumb, index finger and radial hand.",landmark:"Emerges from under brachioradialis about 9 cm proximal to the radial styloid and crosses the radial border of the wrist and the anatomical snuffbox.",depth:"Subcutaneous, alongside the cephalic vein.",injury:"Numbness and a notoriously painful neuroma.",avoid:"Blunt, superficial dissection over the radial wrist; do not catch it in sutures."},"b-volar-wrist":{name:"Volar wrist",layer:"danger",risk:"moderate",summary:"Radial and ulnar arteries, median and ulnar nerves beneath thin skin.",landmark:"Radial artery lateral to the flexor carpi radialis tendon; median nerve and its palmar cutaneous branch between flexor carpi radialis and palmaris longus; ulnar artery and nerve just radial to flexor carpi ulnaris.",depth:"Immediately beneath the deep fascia; the palmar cutaneous branch of the median nerve is subcutaneous.",injury:"Bleeding; numbness of the thenar palm; neuroma.",avoid:"Undermine just beneath the dermis."},"b-digital":{name:"Digital neurovascular bundles & nail unit",layer:"danger",risk:"moderate",summary:"Paired digital nerves and arteries run along each side of the digit.",landmark:"Bundles lie on the palmar-lateral aspects of each finger and toe, level with the ends of the flexion creases. The extensor tendon inserts on the distal phalanx about 1.2 cm proximal to the cuticle; the proximal edge of the nail matrix is just distal to that insertion.",depth:"Subcutaneous. On the dorsum only skin and paratenon cover the extensor tendon; the nail bed lies directly on periosteum.",injury:"Numb fingertip, neuroma, digital ischaemia; mallet deformity (extensor insertion); permanent nail dystrophy (matrix).",avoid:"Digital block at the base (web-space or transthecal) rather than a tight ring of fluid; limit tourniquet time. Preserve paratenon for graft take. For nail-unit tumours remember bone is 1\u20132 mm from the surface."},"b-recurrent-median":{name:"Recurrent motor branch of median n.",layer:"danger",risk:"high",summary:"Motor to the thenar muscles (thumb opposition). Superficial at the base of the thenar eminence.",landmark:"Where a line along the radial border of the middle finger meets Kaplan's cardinal line (from the first web space towards the hook of the hamate), just distal to the flexor retinaculum.",depth:"Under the skin, palmar fat and a thin layer of palmar fascia as it hooks back into the thenar muscles.",injury:"Loss of thumb opposition and abduction; thenar wasting.",avoid:"Keep deep excisions at the base of the thenar eminence above the palmar fascia; spread rather than cut."},"b-femoral":{name:"Femoral triangle",layer:"danger",risk:"moderate",summary:"Femoral nerve, artery and vein, the great saphenous vein and the inguinal nodes.",landmark:"Below the inguinal ligament: nerve, artery, vein from lateral to medial, with the pulse at the mid-inguinal point. The great saphenous vein joins the femoral vein 3\u20134 cm below and lateral to the pubic tubercle.",depth:"The saphenous vein and superficial inguinal nodes are in the subcutaneous fat; the femoral vessels lie under the fascia lata.",injury:"Bleeding; lymphocele or lymphoedema after deep excision.",avoid:"Superficial dissection; tie lymphatics when working deep."},"b-peroneal":{name:"Common peroneal (fibular) n.",layer:"danger",risk:"high",summary:"Winds around the neck of the fibula just under the skin.",landmark:"Palpable against the fibular neck, 1\u20132 cm below the fibular head on the lateral side of the knee.",depth:"Skin, thin fat and fascia only.",injury:"Foot drop, loss of eversion, numb dorsum of the foot and lateral leg.",avoid:"Superficial dissection at the lateral knee; avoid tight dressings and pressure over the fibular neck."},"b-popliteal":{name:"Popliteal fossa",layer:"danger",risk:"moderate",summary:"Popliteal vessels and tibial nerve deep; small saphenous vein and sural nerve superficial.",landmark:"Diamond-shaped hollow behind the knee. The common peroneal nerve follows the biceps femoris tendon along its upper lateral edge.",depth:"Vessels and tibial nerve lie beneath the popliteal fascia in fat.",injury:"Bleeding, nerve injury; scar contracture across the flexion crease.",avoid:"Stay above the fascia; orient or Z-plasty closures to avoid a vertical scar across the crease."},"b-saphenous":{name:"Great saphenous v. & saphenous n.",layer:"danger",risk:"moderate",summary:"Run together in front of the medial malleolus and up the medial leg.",landmark:"Constant position one fingerbreadth anterior to the medial malleolus. The posterior tibial artery and tibial nerve lie behind the malleolus.",depth:"Subcutaneous.",injury:"Bleeding; numbness or neuralgia along the medial ankle and foot.",avoid:"Superficial dissection; ligate the vein if divided."},"b-sural":{name:"Sural n. & small saphenous v.",layer:"danger",risk:"moderate",summary:"Sensation to the lateral ankle, heel and lateral border of the foot.",landmark:"Run down the midline of the calf, then behind the lateral malleolus (between it and the Achilles tendon).",depth:"Subcutaneous in the lower third of the leg.",injury:"Numb lateral foot; painful neuroma.",avoid:"Superficial dissection behind the lateral malleolus."},"b-dorsal-foot":{name:"Dorsum of foot",layer:"danger",risk:"moderate",summary:"Superficial peroneal nerve branches, dorsalis pedis artery and extensor tendons beneath thin skin.",landmark:"Dorsalis pedis pulse lateral to the extensor hallucis longus tendon. The superficial peroneal nerve becomes subcutaneous in the distal third of the lateral leg and fans out over the dorsum.",depth:"Subcutaneous nerves and veins; tendons directly beneath.",injury:"Numbness, neuroma; exposed tendon heals poorly.",avoid:"Undermine just under the dermis; preserve paratenon. Check pulses and perfusion before planning repairs on the foot."},"b-dorsal-hand":{name:"Dorsum of hand",layer:"danger",risk:"moderate",summary:"Extensor tendons, dorsal veins and cutaneous nerve branches directly under thin, mobile skin.",landmark:"Superficial radial nerve branches over the radial side and snuffbox; dorsal branch of the ulnar nerve over the ulnar side.",depth:"Subcutaneous veins and nerves; tendons under a thin dorsal fascia.",injury:"Numbness, neuroma, bleeding; tendon exposure or adhesion.",avoid:"Undermine just beneath the dermis and preserve paratenon so that a graft will take."},"n-median":{name:"Median n.",layer:"motor",risk:"high",summary:"Motor to most forearm flexors and the thenar muscles; sensation to the palmar thumb, index, middle and radial half of the ring finger.",landmark:"Runs with the brachial artery in the medial bicipital groove, lies medial to the artery at the elbow, then deep in the forearm. At the wrist it surfaces between the flexor carpi radialis and palmaris longus tendons before entering the carpal tunnel. Its palmar cutaneous branch leaves about 5 cm above the wrist crease and runs under the skin over the base of the thenar eminence.",depth:"Under the deep fascia in the arm (thin cover medially); deep to the flexor muscles in the forearm; just beneath the fascia for the last 5 cm above the wrist.",injury:"Loss of thumb opposition and thenar wasting, numb radial digits; a painful neuroma if the palmar cutaneous branch is cut.",avoid:"Keep dissection above the deep fascia at the medial arm, antecubital fossa and volar wrist.",block:"Wrist block: 3\u20135 mL between the palmaris longus and flexor carpi radialis tendons at the proximal wrist crease, just under the fascia."},"n-ulnar":{name:"Ulnar n.",layer:"motor",risk:"high",summary:"Motor to most intrinsic hand muscles; sensation to the little finger and ulnar half of the ring finger.",landmark:"Medial arm behind the brachial artery; passes behind the medial epicondyle in the cubital tunnel; runs under flexor carpi ulnaris in the forearm; at the wrist it lies just radial to the flexor carpi ulnaris tendon and pisiform, on the ulnar side of the ulnar artery, and enters the hand through Guyon's canal.",depth:"Subcutaneous behind the medial epicondyle; covered only by skin, fascia and palmaris brevis at the wrist.",injury:"Weak grip and pinch, clawing of the ring and little fingers, numb little finger.",avoid:"Superficial dissection only over the posteromedial elbow and the ulnar side of the volar wrist.",block:"Wrist block: 3\u20135 mL just radial to (or beneath) the flexor carpi ulnaris tendon at the proximal wrist crease; aspirate (ulnar artery)."},"n-radial":{name:"Radial n.",layer:"motor",risk:"moderate",summary:"Motor to the elbow, wrist and finger extensors.",landmark:"Winds round the back of the humerus in the spiral groove, pierces the lateral intermuscular septum about 10 cm above the lateral epicondyle and lies in front of the epicondyle between brachialis and brachioradialis, where it divides into the posterior interosseous (motor) and superficial (sensory) branches.",depth:"Deep to muscle throughout; closest to the surface at the lateral distal arm.",injury:"Wrist drop and loss of finger extension.",avoid:"Not at risk with dissection above the deep fascia. Take care with deep excisions on the lateral distal third of the arm."},"n-axillary":{name:"Axillary n.",layer:"motor",risk:"low",summary:"Motor to deltoid and teres minor; sensation to the skin over the lower deltoid.",landmark:"Winds round the surgical neck of the humerus on the deep surface of deltoid, about 5 cm below the tip of the acromion. Its cutaneous branch (upper lateral cutaneous nerve of the arm) emerges at the posterior border of deltoid.",depth:"Deep to deltoid.",injury:"Weak shoulder abduction; numb patch over the lateral upper arm.",avoid:"Not at risk in skin surgery above the fascia."},"n-mabc":{name:"Medial antebrachial cutaneous n.",layer:"sensory",risk:"moderate",summary:"Sensation to the medial forearm.",landmark:"Pierces the deep fascia with the basilic vein in the middle of the medial arm; its branches cross in front of the medial epicondyle and the antecubital fossa alongside the basilic and median cubital veins.",depth:"Subcutaneous from mid-arm down.",injury:"Numbness or a tender neuroma at the medial elbow and forearm.",avoid:"Blunt, superficial dissection around the medial elbow; do not catch branches in ligatures on the veins."},"n-labc":{name:"Lateral antebrachial cutaneous n.",layer:"sensory",risk:"moderate",summary:"Terminal branch of the musculocutaneous nerve; sensation to the lateral forearm.",landmark:"Emerges just lateral to the biceps tendon at the elbow crease, beneath the cephalic vein, and runs down the radial side of the forearm to the wrist, overlapping the superficial radial nerve.",depth:"Subcutaneous below the elbow.",injury:"Numbness or neuroma of the lateral forearm.",avoid:"Superficial dissection lateral to the biceps tendon and along the cephalic vein."},"n-intercostobrachial":{name:"Intercostobrachial n. (T2)",layer:"sensory",risk:"low",summary:"Sensation to the axilla and the upper medial arm.",landmark:"Leaves the second intercostal space in the mid-axillary line and crosses the axillary fat to the medial arm.",depth:"In the axillary fat, then subcutaneous.",injury:"Numbness or dysaesthesia of the upper medial arm."},"n-dorsal-ulnar":{name:"Dorsal cutaneous branch of ulnar n.",layer:"sensory",risk:"moderate",summary:"Sensation to the ulnar side of the dorsal hand, the little finger and half of the ring finger.",landmark:"Leaves the ulnar nerve about 5 cm above the wrist, passes under flexor carpi ulnaris and becomes subcutaneous at the ulnar styloid, crossing on to the back of the hand.",depth:"Subcutaneous from the ulnar styloid.",injury:"Numbness; painful neuroma.",avoid:"Blunt, superficial dissection over the ulnar border of the wrist.",block:"Subcutaneous infiltration around the ulnar styloid."},"n-femoral":{name:"Femoral n.",layer:"motor",risk:"moderate",summary:"Motor to quadriceps; anterior cutaneous branches to the front of the thigh; continues as the saphenous nerve.",landmark:"Enters the thigh under the inguinal ligament about a fingerbreadth lateral to the femoral pulse and breaks up into its branches within a few centimetres.",depth:"Beneath the fascia lata and the iliacus fascia.",injury:"Weak knee extension; numb anterior thigh and medial leg.",avoid:"Not at risk with dissection above the fascia lata."},"n-lfcn":{name:"Lateral femoral cutaneous n.",layer:"sensory",risk:"moderate",summary:"Sensation to the anterolateral thigh.",landmark:"Passes under the inguinal ligament 1\u20132 cm medial to the anterior superior iliac spine and becomes subcutaneous about 10 cm below it, running down the anterolateral thigh.",depth:"Beneath the fascia lata proximally, subcutaneous below.",injury:"Numbness or burning of the lateral thigh (meralgia paraesthetica).",avoid:"Take care just below and medial to the anterior superior iliac spine and when harvesting grafts from the lateral thigh.",block:"5\u201310 mL fanned 2 cm medial and 2 cm inferior to the anterior superior iliac spine, beneath the fascia \u2014 useful for thigh graft donor sites."},"n-pfcn":{name:"Posterior femoral cutaneous n.",layer:"sensory",risk:"low",summary:"Sensation to the lower buttock, posterior thigh and popliteal fossa.",landmark:"Runs down the midline of the back of the thigh; inferior cluneal branches curl round the gluteal fold.",depth:"Beneath the fascia lata until the lower thigh, then subcutaneous.",injury:"Numbness of the posterior thigh."},"n-sciatic":{name:"Sciatic n.",layer:"motor",risk:"low",summary:"Motor to the hamstrings and everything below the knee.",landmark:"Midway between the ischial tuberosity and the greater trochanter, then down the midline of the posterior thigh; divides into the tibial and common peroneal nerves at the apex of the popliteal fossa.",depth:"Deep to gluteus maximus and the hamstrings.",injury:"Foot drop and loss of all movement below the knee.",avoid:"Not at risk in skin surgery. Intramuscular injections belong in the upper outer quadrant of the buttock."},"n-tibial":{name:"Tibial n.",layer:"motor",risk:"moderate",summary:"Motor to the calf and the sole; sensation to the sole through the plantar and medial calcaneal nerves.",landmark:"Down the midline of the popliteal fossa (superficial to the vessels), deep in the calf, then behind the medial malleolus in the tarsal tunnel, just posterior to the posterior tibial pulse.",depth:"Beneath the popliteal fascia; deep to soleus; under the flexor retinaculum at the ankle.",injury:"Numb sole, weak toe flexion.",avoid:"Stay above the deep fascia behind the knee and the medial malleolus.",block:"Posterior tibial block: 3\u20135 mL just posterior to the posterior tibial pulse, midway between the medial malleolus and the Achilles tendon. Anaesthetises most of the sole."},"n-plantar":{name:"Medial & lateral plantar nn.",layer:"motor",risk:"low",summary:"Terminal branches of the tibial nerve: motor to the intrinsic foot muscles, sensation to the sole and toes.",landmark:"Enter the sole beneath abductor hallucis. The medial plantar nerve supplies the medial three and a half toes, the lateral the rest; the plantar digital nerves run between the metatarsal heads.",depth:"Deep to the plantar aponeurosis; digital branches become superficial in the web spaces.",injury:"Numb toes; painful neuroma on a weight-bearing surface.",avoid:"Excisions above the plantar aponeurosis are safe."},"n-deep-peroneal":{name:"Deep peroneal (fibular) n.",layer:"motor",risk:"moderate",summary:"Motor to the ankle and toe dorsiflexors; sensation to the first web space.",landmark:"Runs down the anterior compartment with the anterior tibial artery. At the ankle it lies between the extensor hallucis longus and extensor digitorum longus tendons, then beside the dorsalis pedis artery to the first web space.",depth:"Deep in the leg; beneath the extensor retinaculum at the ankle; under the thin dorsal fascia on the foot.",injury:"Numb first web space (distal injury); foot drop if injured high.",avoid:"Undermine just beneath the dermis on the dorsum of the foot.",block:"2\u20133 mL beside the dorsalis pedis pulse, lateral to the extensor hallucis longus tendon."},"n-superficial-peroneal":{name:"Superficial peroneal (fibular) n.",layer:"sensory",risk:"moderate",summary:"Sensation to the distal anterolateral leg and most of the dorsum of the foot.",landmark:"Pierces the deep fascia on the anterolateral leg 10\u201312 cm above the lateral malleolus and divides over the front of the ankle. Its branches often show as cords under the skin when the foot is plantarflexed and inverted.",depth:"Subcutaneous in the distal third of the leg and on the foot.",injury:"Numbness and a painful neuroma that rubs on footwear.",avoid:"Blunt, superficial dissection on the distal anterolateral leg, ankle and dorsal foot.",block:"Subcutaneous wheal across the front of the ankle from the tibial crest to the lateral malleolus."},"a-brachial":{name:"Brachial a.",layer:"vessels",risk:"moderate",summary:"Main artery of the arm.",landmark:"Pulse in the medial bicipital groove, with the median nerve. At the elbow it lies medial to the biceps tendon under the bicipital aponeurosis and divides about 1 cm below the crease into the radial and ulnar arteries.",depth:"Covered only by skin, fat and deep fascia along the medial arm.",injury:"Major bleeding; limb ischaemia.",avoid:"Stay above the deep fascia on the medial arm and in the antecubital fossa."},"a-radial":{name:"Radial a.",layer:"vessels",risk:"moderate",summary:"Runs down the radial side of the forearm to the wrist and the anatomical snuffbox.",landmark:"Under the edge of brachioradialis, then superficial at the wrist, where the pulse is felt lateral to the flexor carpi radialis tendon. It turns dorsally through the snuffbox.",depth:"Just beneath the deep fascia in the distal forearm.",injury:"Brisk bleeding. Check ulnar collateral flow (Allen's test) before any procedure that might sacrifice it.",avoid:"Superficial dissection at the radial volar wrist."},"a-ulnar":{name:"Ulnar a.",layer:"vessels",risk:"moderate",summary:"Runs down the ulnar side of the forearm and forms the superficial palmar arch.",landmark:"Deep under flexor carpi ulnaris in the forearm; at the wrist it lies just radial to the flexor carpi ulnaris tendon and the ulnar nerve, then enters the palm through Guyon's canal.",depth:"Beneath the deep fascia at the wrist.",injury:"Brisk bleeding."},"a-palmar-arch":{name:"Superficial palmar arch",layer:"vessels",risk:"moderate",summary:"Continuation of the ulnar artery; gives off the common digital arteries.",landmark:"Crosses the palm level with the distal border of the fully extended thumb.",depth:"Directly beneath the palmar aponeurosis, superficial to the digital nerves and flexor tendons.",injury:"Brisk bleeding.",avoid:"Excisions that stay above the palmar aponeurosis are safe."},"a-femoral":{name:"Femoral a.",layer:"vessels",risk:"moderate",summary:"Main artery of the lower limb.",landmark:"Pulse at the mid-inguinal point (midway between the anterior superior iliac spine and the pubic symphysis), with the vein medial and the nerve lateral. Runs down the femoral triangle and the adductor canal on the medial thigh.",depth:"Beneath the fascia lata; covered only by skin, fat and fascia in the femoral triangle.",injury:"Major bleeding.",avoid:"Stay above the fascia lata in the groin."},"a-popliteal":{name:"Popliteal a.",layer:"vessels",risk:"low",summary:"Continuation of the femoral artery behind the knee.",landmark:"Deepest structure in the popliteal fossa, against the joint capsule; the vein and tibial nerve lie over it.",depth:"Deep to the popliteal fascia and fat.",injury:"Major bleeding; limb ischaemia.",avoid:"Stay above the popliteal fascia."},"a-anterior-tibial":{name:"Anterior tibial a. & dorsalis pedis",layer:"vessels",risk:"moderate",summary:"Supplies the anterior compartment and the dorsum of the foot.",landmark:"Runs down the front of the interosseous membrane and crosses the ankle midway between the malleoli. The dorsalis pedis pulse is just lateral to the extensor hallucis longus tendon, heading for the first intermetatarsal space.",depth:"Deep in the leg; under thin skin and fascia on the dorsum of the foot.",injury:"Bleeding; may be the dominant supply to the forefoot.",avoid:"Feel both pedal pulses before surgery on the foot or ankle."},"a-posterior-tibial":{name:"Posterior tibial a.",layer:"vessels",risk:"moderate",summary:"Supplies the posterior compartment and the sole through the plantar arteries.",landmark:"Pulse midway between the medial malleolus and the Achilles tendon, with the tibial nerve just behind it.",depth:"Under the flexor retinaculum at the ankle; the plantar arch lies deep in the sole.",injury:"Bleeding; ischaemia of the sole in arterial disease.",avoid:"Stay above the deep fascia behind the medial malleolus."},"v-cephalic":{name:"Cephalic v.",layer:"vessels",risk:"low",summary:"Superficial vein of the radial side of the upper limb.",landmark:"From the dorsal venous network over the snuffbox, up the radial forearm (with the superficial radial and lateral antebrachial cutaneous nerves), lateral to biceps, then in the deltopectoral groove.",depth:"Subcutaneous.",injury:"Bleeding. Worth preserving in patients who may need dialysis access.",avoid:"Ligate rather than cauterise; free the adjacent nerve before tying."},"v-basilic":{name:"Basilic & median cubital vv.",layer:"vessels",risk:"low",summary:"Superficial veins of the ulnar side of the forearm and the front of the elbow.",landmark:"From the ulnar side of the dorsal venous network, up the medial forearm, in front of the medial epicondyle, then through the deep fascia in the middle of the arm. The median cubital vein links it to the cephalic vein across the antecubital fossa.",depth:"Subcutaneous below mid-arm, alongside the medial antebrachial cutaneous nerve.",injury:"Bleeding. Worth preserving in patients who may need dialysis access."},"v-great-saphenous":{name:"Great saphenous v.",layer:"vessels",risk:"moderate",summary:"Longest superficial vein; runs with the saphenous nerve below the knee.",landmark:"From the medial end of the dorsal venous arch, one fingerbreadth in front of the medial malleolus, up the medial leg, a hand's breadth behind the patella, up the medial thigh to the saphenofemoral junction 3\u20134 cm below and lateral to the pubic tubercle.",depth:"Subcutaneous, on the deep fascia.",injury:"Bleeding; loss of a potential bypass conduit.",avoid:"Preserve it where possible; if divided, ligate both ends and spare the nerve."},"v-small-saphenous":{name:"Small saphenous v.",layer:"vessels",risk:"low",summary:"Superficial vein of the back of the calf; runs with the sural nerve.",landmark:"From the lateral end of the dorsal venous arch, behind the lateral malleolus, up the midline of the calf, through the deep fascia in mid-calf to the popliteal vein.",depth:"Subcutaneous in the lower half of the calf.",injury:"Bleeding; the sural nerve is easily caught in a ligature."}},wf={high:{label:"High risk",color:"#c2182f"},moderate:{label:"Caution",color:"#b56a00"},low:{label:"Low risk",color:"#5b7a52"}};var Rt="Free margin",kc={"fa-frontal-scalp":{auc:"M",structures:["v1-supraorbital","v1-supratrochlear","a-sta"],sensory:"Supraorbital and supratrochlear nn. (V1).",artery:"Supraorbital, supratrochlear and frontal branch of superficial temporal aa.",lymph:"Parotid (preauricular) nodes; near the midline drainage may be bilateral.",plane:"Subgaleal (loose areolar tissue between galea and pericranium) \u2014 bloodless and easy.",notes:["Layers: Skin, Connective tissue (vessels and nerves), Aponeurosis (galea), Loose areolar tissue, Pericranium.","Scalp skin is inelastic; wide subgaleal undermining and galeotomies (parallel to the wound edge, sparing the vessels above the galea) gain only a few millimetres each.","Vessels sit in the dense subcutaneous layer and do not retract \u2014 suture-ligate or use a running locked suture for haemostasis.","Bevel incisions parallel to the hair shafts to limit scar alopecia."],repair:["Secondary intention heals well where pericranium is intact (slow; hairless scar).","Primary closure with galeal plication sutures.","Rotation flaps (single, O\u2013Z, pinwheel) \u2014 make them long, 4\u20136\xD7 the defect width.","Split- or full-thickness skin graft on pericranium.","Bare bone: burr or fenestrate the outer table to bleeding diplo\xEB, or use a pericranial flap or dermal substitute, then graft."]},"h-temporal-scalp":{like:"fa-frontal-scalp",structures:["a-sta","v3-auriculotemporal","vii-temporal"],sensory:"Auriculotemporal n. (V3); lesser occipital n. behind the ear.",artery:"Superficial temporal a. (parietal branch).",lymph:"Parotid (preauricular) nodes; postauricular nodes posteriorly.",plane:"Subgaleal over the vertex side; below the superior temporal line stay in the subcutaneous fat above the superficial temporal fascia, which carries the superficial temporal vessels."},"h-parietal-scalp":{like:"fa-frontal-scalp",structures:["a-sta","a-occipital"],sensory:"Auriculotemporal (V3), lesser occipital (C2) and greater occipital (C2) nn.; deep branch of the supraorbital n. anteriorly.",artery:"Parietal branch of superficial temporal a.; occipital a. posteriorly.",lymph:"Parotid, postauricular (mastoid) and occipital nodes."},"h-vertex-scalp":{like:"fa-frontal-scalp",structures:["a-sta","a-occipital","c-greater-occipital"],sensory:"Watershed of supraorbital (V1), auriculotemporal (V3) and greater occipital (C2) nn. \u2014 a ring block is usually easier than named blocks.",artery:"Anastomosis of both superficial temporal and occipital systems.",lymph:"Unpredictable and often bilateral: parotid, postauricular and occipital nodes."},"h-occipital-scalp":{like:"fa-frontal-scalp",structures:["c-greater-occipital","a-occipital","c-lesser-occipital"],sensory:"Greater occipital n. (C2); lesser occipital n. laterally; third occipital n. (C3) near the midline at the nape.",artery:"Occipital a.",lymph:"Occipital and postauricular nodes, then posterior triangle (level V).",plane:"Subgaleal above the superior nuchal line. Below it the galea gives way to the nuchal muscles \u2014 stay in subcutaneous fat."},"fa-central-forehead":{auc:"M",structures:["v1-supratrochlear","v1-supraorbital","a-supraorbital"],sensory:"Supratrochlear n. medially, supraorbital n. laterally (V1). Supraorbital + supratrochlear blocks numb the forehead to the vertex.",artery:"Supratrochlear and supraorbital aa.",lymph:"Parotid (preauricular) nodes; the midline can drain to either side or to submandibular nodes.",plane:"Subcutaneous fat just above frontalis for small repairs; subgaleal (deep to frontalis) for large advancement flaps.",notes:["Relaxed skin tension lines are horizontal, but the sensory nerves run vertically: a vertical closure near the midline spares them and heals well; long horizontal incisions down to muscle leave the scalp numb behind them.","Keep the brows level and the hairline undistorted \u2014 brow elevation of a few millimetres usually settles; asymmetric pull does not.","The deep branch of the supraorbital nerve runs under the galea 0.5\u20131.5 cm medial to the temporal crest."],repair:["Primary closure: vertical in the midline or paramedian forehead, horizontal within a rhytid laterally.","Unilateral or bilateral advancement (H-plasty, O\u2013T / A\u2013T with the bar hidden at the brow or hairline).","Secondary intention for superficial wounds, especially at the hairline and temple junction.","Full-thickness graft, or partial closure with guiding sutures and granulation, when tissue is short."]},"fa-lateral-forehead":{like:"fa-central-forehead",structures:["v1-supraorbital","vii-temporal","a-supraorbital","a-sta"],sensory:"Supraorbital n. (V1), superficial and deep divisions; zygomaticotemporal n. (V2) at the temporal edge.",artery:"Supraorbital a.; frontal branch of superficial temporal a.",lymph:"Parotid (preauricular) nodes.",alerts:["Lateral to the mid-brow the temporal branch of the facial nerve enters frontalis from beneath \u2014 stay in the superficial fat."]},"fa-glabella":{auc:"H",aucNote:"central face (the forehead proper is area M)",structures:["v1-supratrochlear","a-dorsal-nasal","v1-infratrochlear"],sensory:"Supratrochlear and infratrochlear nn. (V1).",artery:"Supratrochlear and dorsal nasal aa. (ophthalmic) \u2014 the origin of the paramedian forehead flap pedicle.",lymph:"Submandibular or parotid nodes.",plane:"Subcutaneous fat above procerus and corrugator.",notes:["Thick, sebaceous skin with vertical and oblique frown lines to hide scars in.","Avoid drawing the medial brows together or webbing the nasal root.","Intravascular injection here can embolise to the ophthalmic circulation \u2014 aspirate and inject slowly."],repair:["Primary closure, vertical.","Secondary intention in the concavity towards the nasal root.","Glabellar transposition or V\u2013Y advancement for the nasal root.","Full-thickness graft."]},"fa-temple":{auc:"H",alerts:["Temporal branch of the facial nerve is superficial here \u2014 undermine above the superficial temporal fascia."],structures:["vii-temporal","a-sta","v3-auriculotemporal","v2-zygomaticotemporal"],sensory:"Zygomaticotemporal n. (V2) anteriorly, auriculotemporal n. (V3) posteriorly.",artery:"Superficial temporal a. (frontal branch); zygomatico-orbital branch.",lymph:"Parotid (preauricular) nodes.",plane:"Superficial subcutaneous fat, above the superficial temporal (temporoparietal) fascia. The nerve and the superficial temporal vessels lie in or just under that fascia.",notes:["Layers: skin, thin fat, superficial temporal fascia (continuous with SMAS and galea), loose areolar tissue, deep temporal fascia, temporalis.","The shiny white deep temporal fascia is a safe floor for deep tumour excision, but reaching it means the nerve's layer has been crossed.","Tension on the temple pulls the lateral brow and lateral canthus; anchor flaps and keep vectors off them."],repair:["Secondary intention \u2014 the concave temple heals with good contour, even for large wounds.","Primary closure along the crow's-foot / forehead lines.","Rotation or advancement from the cheek and preauricular skin; rhombic transposition; O\u2013Z.","Full-thickness graft for large defects."]},"fa-eyebrow":{auc:"H",structures:["v1-supraorbital","v1-supratrochlear","vii-temporal"],sensory:"Supraorbital and supratrochlear nn. (V1).",artery:"Supraorbital and supratrochlear aa.; superficial temporal a. laterally.",lymph:"Parotid nodes (lateral); submandibular nodes (medial).",plane:"Deep subcutaneous fat below the hair bulbs (they sit deep), above orbicularis and frontalis.",notes:["Brow hairs grow obliquely: bevel the incision parallel to the shafts to avoid a hairless scar.","Do not shave the brow \u2014 it is the alignment landmark and regrowth is unreliable.","The supraorbital neurovascular bundle leaves the rim under the medial third of the brow."],repair:["Primary closure within or along the brow; bilateral advancement flaps (O\u2013T, H-plasty) to keep the hair-bearing line continuous.","Island pedicle (V\u2013Y) flap of remaining brow.","Accept a narrower brow rather than a displaced one."]},"fa-upper-eyelid":{auc:"H",alerts:[Rt+": lid margin \u2014 vertical tension causes lagophthalmos or ectropion."],structures:["v1-supraorbital","v1-supratrochlear","lacrimal"],sensory:"Supraorbital, supratrochlear and infratrochlear nn. medially, lacrimal n. laterally (all V1).",artery:"Medial and lateral palpebral aa. forming the marginal and peripheral arcades.",lymph:"Lateral two-thirds to parotid (preauricular) nodes; medial third to submandibular nodes.",plane:"Directly beneath the skin, above orbicularis \u2014 there is no subcutaneous fat. Skin\u2013muscle flaps are raised beneath orbicularis.",notes:["Lamellae: anterior (skin and orbicularis) and posterior (tarsus and conjunctiva). The upper tarsus is 10 mm high, the lower 4 mm.","The levator aponeurosis inserts on the upper tarsus and into the lid crease; dividing it causes ptosis.","Orient closures so tension runs parallel to the lid margin. Protect the cornea (shield, ointment) and use bipolar cautery.","Lax lid skin bruises and swells readily; lidocaine with adrenaline in small volumes."],repair:["Primary closure, horizontal, in the lid crease.","Full-thickness graft from the opposite upper lid (best match) or postauricular skin.","Full-thickness margin defects: direct layered closure up to about a quarter of the lid tery:"Dorsal nasal a.; angular a.",lymph:"Submandibular nodes.",plane:"Beneath the nasal SMAS (procerus), just above periosteum \u2014 the avascular plane of the nose.",notes:["Thin, mobile skin over the nasal bones; the concavity between glabella and dorsum heals well by granulation.","Avoid webbing between the medial canthi and narrowing the inter-brow distance."],repair:["Primary closure (vertical or horizontal in the transverse root crease).","Secondary intention.","Glabellar V\u2013Y or transposition flap.","Full-thickness graft."]},"fa-nasal-dorsum":{auc:"H",structures:["v1-external-nasal","a-dorsal-nasal"],sensory:"Infratrochlear n. above; external nasal n. (anterior ethmoidal, V1) below the rhinion.",artery:"Dorsal nasal a.; lateral nasal a. (from angular); external nasal a.",lymph:"Submandibular nodes.",plane:"Beneath the nasal SMAS (nasalis), just above perichondrium and periosteum. Vessels and nerves run above this plane, in or over the muscle.",notes:["Skin is thin and mobile over the bony upper two-thirds, thicker and sebaceous towards the tip.","Burget & Menick subunit principle: if a defect takes up more than half of a convex subunit, consider resurfacing the whole subunit."],repair:["Primary closure, vertical in the midline (small defects).","Dorsal nasal (Rieger) rotation flap for defects of the lower dorsum and tip up to about 2 cm.","Bilobed or rhombic transposition flap; full-thickness graft over intact perichondrium."]},"fa-nasal-sidewall":{auc:"H",structures:["a-angular","v2-infraorbital","v1-infratrochlear"],sensory:"Infratrochlear n. (upper), infraorbital n. (lower).",artery:"Angular a. and its lateral nasal branch; dorsal nasal a.",lymph:"Submandibular nodes.",plane:"Beneath the nasal SMAS on the nose; when recruiting cheek skin, subcutaneous fat on the cheek side.",notes:["Do not tent across the nasofacial sulcus: tack the flap down to periosteum to re-create it.","The lower sidewall overlies the internal nasal valve \u2014 downward or inward pull, or loss of support, can collapse it. Check breathing before closing.","Upward or medial pull near the medial canthus and lower lid causes ectropion."],repair:["Primary closure parallel to the nasofacial sulcus.","Secondary intention in the concave upper sidewall near the canthus.","Cheek advancement (Burow's) flap; V\u2013Y island pedicle flap.","Rhombic or bilobed transposition; full-thickness graft."]},"fa-nasal-supratip":{like:"fa-nasal-tip",notes:["The supratip is the dorsum just above the domes, where the dorsal septum and upper lateral cartilages meet the lower lateral cartilages.","Thick sebaceous skin with little spare laxity; closure tension here lifts the tip or flares the alae.","Dead space or bulky flaps here produce a 'polly-beak' fullness."]},"fa-nasal-tip":{auc:"H",structures:["v1-external-nasal","a-angular"],sensory:"External nasal n. (V1); infraorbital n. (V2) laterally. Tip anaesthesia needs an external nasal block or local infiltration.",artery:"Lateral nasal aa. (from angular) and columellar aa. (from superior labial) forming the tip arcade; external nasal a.",lymph:"Submandibular nodes.",plane:"Beneath the nasal SMAS, on the perichondrium of the lower lateral cartilages.",notes:["Thick, sebaceous, immobile skin bound to the alar cartilages \u2014 almost no local laxity.","Grafts tend to heal depressed and shiny on sebaceous tips; dermabrasion at 6\u20138 weeks improves the match.","Replace lost cartilage support (conchal or septal graft) before resurfacing."],repair:["Bilobed transposition flap (Zitelli design) for defects up to about 1.5 cm on the distal third; trilobed flap for more distal or larger defects.","East\u2013west (horizontal advancement) flap for small midline or paramedian defects.","Dorsal nasal (Rieger) rotation flap up to about 2 cm.","Full-thickness graft (preauricular, conchal bowl, or a Burow's graft).","Paramedian forehead flap for large or deep defects, or when cartilage must be replaced."]},"fa-nasal-infratip":{like:"fa-nasal-tip",alerts:[Rt+": nostril rim \u2014 notching and asymmetry are obvious from below."],notes:["The infratip lobule runs from the tip-defining points down to the columella, between the soft triangles.","Skin is thin and adherent to the medial and middle crura."],repair:["Full-thickness graft or composite graft.","Secondary intention for small superficial wounds.","Bilateral advancement of the remaining tip skin; paramedian forehead flap for large defects."]},"fa-nasal-ala":{auc:"H",alerts:[Rt+": alar rim \u2014 contraction causes notching or elevation.","Embryonic fusion plane at the alar crease \u2014 tumours can extend deeply."],structures:["a-angular","v2-infraorbital"],sensory:"Infraorbital n. (V2); external nasal n. medially.",artery:"Lateral nasal a. (runs in or just above the alar groove) and the superior alar branch, from the angular a.",lymph:"Submandibular nodes.",plane:"Beneath the nasal SMAS medially. The alar lobule itself has no cartilage \u2014 it is fibrofatty tissue bonded to the skin, so there is no real plane.",notes:["The ala keeps its shape by its fibrofatty bulk; deep defects need a non-anatomic cartilage batten (conchal) to prevent rim retraction and external valve collapse.","Preserve or re-create the alar groove and the alar-facial sulcus; flaps crossing them blunt the nose.","Do not push the ala medially (obstructs the airway) or pull it up."],repair:["Secondary intention for small, superficial wounds well away from the rim, especially in the alar groove.","Full-thickness graft (preauricular or conchal bowl skin).","Bilobed or trilobed flap for the medial ala; V\u2013Y island pedicle from the sidewall or cheek for the lateral ala.","Melolabial (nasolabial) transposition flap, single stage \u2014 tends to blunt the groove.","Melolabial interpolation flap in two stages for whole-subunit or deep defects, with a cartilage batten.","Composite graft from the helical root for small full-thickness rim defects (up to about 1 cm)."]},"fa-soft-triangle":{auc:"H",alerts:[Rt+": the soft triangle has no cartilage and notches easily."],structures:["v1-external-nasal"],sensory:"External nasal n. (V1); infraorbital n. (V2).",artery:"Tip arcade (lateral nasal and columellar aa.).",lymph:"Submandibular nodes.",plane:"None \u2014 external skin lies directly on vestibular skin, with no cartilage between.",notes:["Any contraction shows as a notch in the nostril rim.","Keep sutures and cautery away from the rim where possible."],repair:["Secondary intention for small superficial wounds.","Full-thickness or composite graft.","Larger defects are repaired as part of a tip or ala reconstruction."]},"fa-columella":{auc:"H",structures:["a-labial"],sensory:"External nasal n. (V1) above; infraorbital n. (V2) and nasopalatine branches at the base.",artery:"Columellar aa. from the superior labial a.",lymph:"Submandibular nodes.",plane:"Directly on the medial crura \u2014 skin is thin and adherent.",notes:["The columellar arteries run vertically either side of the midline.","Loss of columellar height drops the tip; scarring at the base distorts the nasolabial angle."],repair:["Full-thickness graft; composite graft from the ear.","Secondary intention for small wounds.","Bilateral melolabial or upper-lip flaps, or a forehead flap, for total loss."]},"fa-nasal-vestibule":{auc:"H",alerts:[Rt+": nostril sill and rim."],structures:["a-labial","v2-infraorbital"],sensory:"Infraorbital n. (V2); nasopalatine and anterior ethmoidal branches inside.",artery:"Superior labial a. (septal and alar branches); lateral nasal a.",lymph:"Submandibular nodes.",plane:"Vestibular skin is bound to the alar cartilage and sill.",notes:["The nostril sill is the ridge between the alar base and the columella, at the junction of nose and lip.","Circumferential scarring narrows the nostril (vestibular stenosis) \u2014 consider a stent after repair.","Hair-bearing vestibular skin (vibrissae) changes to mucosa at the limen nasi."],repair:["Secondary intention for small sill wounds.","Full-thickness graft.","Upper-lip advancement or island flap to rebuild the sill; composite graft for lining plus cover."]},"fa-medial-cheek":{auc:"M",alerts:["Tension towards the lower eyelid causes ectropion \u2014 keep vectors horizontal and suspend flaps to periosteum."],structures:["v2-infraorbital","a-angular","a-facial","vii-zygomatic","vii-buccal"],sensory:"Infraorbital n. (V2).",artery:"Angular and infraorbital aa.; transverse facial a.",lymph:"Submandibular nodes (some via facial / buccinator nodes); upper lateral part to parotid nodes.",plane:"Mid-subcutaneous fat, above the SMAS and the mimetic muscles.",notes:["The infraorbital foramen lies under this subunit, deep to levator labii superioris.","Hide scars in the nasofacial sulcus, the melolabial fold and the lid\u2013cheek junction.","Medial to the lateral canthus the facial nerve branches are small and interconnected; the main risks here are the eyelid, the angular vessels and the infraorbital nerve."],repair:["Primary closure along relaxed skin tension lines, with the scar in or parallel to the melolabial fold.","Cheek advancement flap with a Burow's triangle in the nasofacial sulcus or along the lid.","V\u2013Y island pedicle flap for defects beside the ala and upper lip.","Cheek rotation (Mustard\xE9) flap for large infraorbital defects; full-thickness graft if needed."]},"fa-zygomatic-cheek":{auc:"M",alerts:["Zygomatic branches of the facial nerve cross the malar eminence under thin fat.","Upward-lateral repairs can still pull on the lower lid."],structures:["vii-zygomatic","zone-midcheek","vii-temporal","v2-zygomaticofacial"],sensory:"Zygomaticofacial n. (V2); infraorbital n. (V2).",artery:"Transverse facial a.; zygomatico-orbital a.",lymph:"Parotid (preauricular) nodes.",plane:"Subcutaneous fat above the SMAS. The fat is thin over the bone and the zygomatic retaining ligaments tether the skin here.",notes:["The zygomatic arch's upper border marks where the temporal branch starts its superficial course.","Release of the zygomatic retaining ligaments adds flap mobility but brings dissection close to the zygomatic branches."],repair:["Primary closure along crow's-foot and cheek lines.","Rhombic transposition; rotation or advancement from the lateral cheek.","Full-thickness graft."]},"fa-lateral-cheek":{auc:"H",aucNote:"periauricular skin",alerts:["Embryonic fusion plane at the preauricular sulcus \u2014 tumours can track deeply towards the parotid and ear canal."],structures:["parotid","a-sta","v3-auriculotemporal","vii-trunk","c-great-auricular"],sensory:"Auriculotemporal n. (V3) above; great auricular n. (C2\u2013C3) below.",artery:"Superficial temporal a. and its transverse facial branch.",lymph:"Parotid (preauricular) nodes.",plane:"Subcutaneous fat above the parotid fascia (SMAS). The facial nerve branches are inside the gland and safe while its fascia is intact.",notes:["The best reservoir of lax skin on the face \u2014 and a good full-thickness graft donor site.","The superficial temporal pulse and auriculotemporal nerve are just in front of the tragus and helical root.","Avoid moving bearded sideburn skin on to the ear, or removing the sideburn."],repair:["Primary closure in the preauricular crease (vertical).","Advancement or rotation from the cheek and neck.","Secondary intention or graft only when necessary."]},"fa-buccal-cheek":{auc:"M",structures:["zone-midcheek","vii-buccal","parotid-duct","a-facial","vii-marginal"],sensory:"Buccal n. (V3) and infraorbital n. (V2); mental n. inferiorly; great auricular n. posteriorly.",artery:"Facial a. and transverse facial a.",lymph:"Submandibular nodes; posterior part to parotid nodes.",plane:"Mid-subcutaneous fat, above the SMAS.",notes:["Anterior to the parotid and masseter the buccal branches and the parotid duct lie on the buccal fat pad under a thin SMAS.","Thick, mobile skin with a good blood supply: large flaps survive well.","The mandibular retaining ligament and the masseteric ligaments limit advancement."],repair:["Primary closure along the curved relaxed skin tension lines.","Rhombic or other transposition flaps.","Rotation or advancement flaps based inferiorly and laterally; cervicofacial flap for large defects."]},"fa-melolabial-fold":{auc:"M",aucNote:"cheek; the adjacent ala and lip are area H",alerts:["Embryonic fusion plane at the alar-facial junction \u2014 tumours can extend deeply."],structures:["a-facial","a-angular","a-labial","v2-infraorbital"],sensory:"Infraorbital n. (V2).",artery:"Facial a. running just deep and lateral to the fold, becoming the angular a. at the alar base.",lymph:"Submandibular nodes.",plane:"Subcutaneous fat. The lip elevators insert into the dermis along the fold, so fat is thin medially and thick laterally.",notes:["Keep the two folds symmetric: a scar in the fold is invisible, one that crosses or flattens it is not.","Donor site for melolabial transposition and interpolation flaps, supplied by perforators of the facial and angular arteries."],repair:["Primary closure in the fold.","V\u2013Y island pedicle flap.","Cheek advancement with the scar placed in the fold."]},"fa-philtrum":{auc:"H",alerts:[Rt+": vermilion border and Cupid's bow \u2014 mark them before infiltrating.","Embryonic fusion plane."],structures:["a-labial","v2-infraorbital"],sensory:"Infraorbital nn. (V2), both sides.",artery:"Superior labial a.; its columellar and septal branches.",lymph:"Submandibular nodes; midline lesions may drain to both sides.",plane:"Just above orbicularis oris, in the thin subcutaneous fat. Muscle fibres insert into the dermis.",notes:["Philtral columns and dimple are hard to re-create; keep vertical scars on a column.","A 1 mm step in the vermilion border is visible at conversational distance."],repair:["Primary closure, vertical, on a philtral column.","Full-thickness graft of the whole philtral subunit; secondary intention for small central wounds.","Bilateral advancement; Abbe flap for full-thickness loss."]},"fa-lateral-upper-lip":{auc:"H",alerts:[Rt+": vermilion border \u2014 mark it before infiltrating; avoid pulling the lip up."],structures:["a-labial","v2-infraorbital","a-facial","vii-buccal"],sensory:"Infraorbital n. (V2). An infraorbital block numbs the hemi-lip.",artery:"Superior labial a.",lymph:"Submandibular nodes.",plane:"Just above orbicularis oris.",notes:["Relaxed skin tension lines are vertical (radial to the mouth).","Keep scars within the subunit: do not cross the melolabial fold or the philtral column if it can be avoided.","Men: move hair-bearing skin only on to hair-bearing sites."],repair:["Primary closure, vertical; a crescentic perialar excision lets the lip advance beneath the ala.","V\u2013Y island pedicle flap from the lateral lip and cheek.","Rotation flap along the melolabial fold; full-thickness graft for superficial apical-triangle defects.","Full-thickness defects: wedge up to a third of the lip; Abbe (lip-switch) flap for a third to two-thirds; Karapandzic or other circumoral flaps beyond that."]},"fa-upper-vermilion":{auc:"H",alerts:[Rt+": mark the vermilion border before infiltrating."],structures:["a-labial","v2-infraorbital"],sensory:"Infraorbital nn. (V2).",artery:"Superior labial a. \u2014 between orbicularis and mucosa at about the level of the vermilion border.",lymph:"Submandibular nodes.",plane:"Submucosal, above orbicularis oris, for mucosal advancement.",notes:["Vermilion is modified mucosa with no hair or sweat glands; the wet\u2013dry line separates it from labial mucosa.","Squamous cell carcinoma of the lip carries a higher metastatic risk than at most skin sites \u2014 examine the neck."],repair:["Secondary intention for small superficial defects.","Primary closure perpendicular to the border.","Mucosal advancement flap (after vermilionectomy); V\u2013Y mucosal advancement.","Wedge excision or lip-switch flap for full-thickness loss."]},"fa-lower-vermilion":{like:"fa-upper-vermilion",structures:["a-labial","v3-mental"],sensory:"Mental nn. (V3). Bilateral mental blocks numb the whole lower lip.",artery:"Inferior labial a.",lymph:"Central third to submental nodes (either side); lateral thirds to submandibular nodes.",notes:["The usual site of actinic cheilitis and lip squamous cell carcinoma; examine the submental and submandibular nodes.","Mental nerve branches run just under the mucosa of the lower lip."],repair:["Secondary intention for small superficial defects.","Vermilionectomy with mucosal advancement flap for field disease.","Wedge excision (up to a third, sometimes half, of the lower lip), closed in layers: mucosa, muscle, skin, with the vermilion border aligned first.","Larger: Abbe / Estlander lip-switch, Karapandzic, or Bernard\u2013Burow advancement."]},"fa-oral-commissure":{auc:"H",alerts:[Rt+": commissure \u2014 blunting or displacement affects speech, eating and symmetry."],structures:["a-facial","a-labial","vii-buccal","vii-marginal"],sensory:"Infraorbital n. (V2), mental n. (V3) and buccal n. (V3).",artery:"Facial a. about 1.5 cm lateral to the commissure, where the labial arteries arise.",lymph:"Submandibular nodes.",plane:"Subcutaneous, above the modiolus (where orbicularis, the zygomatic muscles, risorius, buccinator and the depressors converge).",notes:["Avoid circumferential scars that cause microstomia.","The modiolus is the motor hub of the smile; deep excisions change its dynamics."],repair:["Primary closure along a radial line.","Secondary intention for small partial-thickness wounds.","Rhombic or V\u2013Y flaps from the cheek; Estlander flap for full-thickness defects involving the commissure."]},"fa-lower-lip":{auc:"H",alerts:[Rt+": vermilion border \u2014 avoid downward pull (eversion, incompetence)."],structures:["v3-mental","a-labial","vii-marginal"],sensory:"Mental n. (V3).",artery:"Inferior labial a.; mental a.",lymph:"Submental nodes centrally; submandibular nodes laterally.",plane:"Just above orbicularis oris and the lip depressors.",notes:["Relaxed skin tension lines are vertical on the lip and curve around the chin; the labiomental crease is a natural boundary for scars and flaps.","Lower-lip function (oral competence) depends on the depressors supplied by the marginal mandibular nerve."],repair:["Primary closure, vertical, not crossing the labiomental crease if possible (use an M-plasty).","V\u2013Y island pedicle or bilateral advancement along the crease.","Wedge excision for full-thickness defects, as for the vermilion."]},"fa-chin":{auc:"H",structures:["v3-mental","vii-marginal"],sensory:"Mental nn. (V3); a twig of the mylohyoid n. under the chin.",artery:"Mental a., inferior labial a., submental a.",lymph:"Submental nodes; submandibular nodes laterally.",plane:"Subcutaneous fat above mentalis \u2014 thick, fibrous skin with muscle fibres inserting into the dermis.",notes:["Thick sebaceous skin under constant movement: scars tend to spread or pin-cushion. Evert carefully and support with buried sutures.","The mental foramen lies under the lateral edge of the chin subunit."],repair:["Primary closure along the labiomental crease or vertically in the midline.","O\u2013T / A\u2013T advancement with the bar in the labiomental crease or submental crease.","Rotation flap along the chin border; secondary intention for small wounds."]},"fa-jawline":{auc:"M",alerts:["Marginal mandibular nerve crosses the facial vessels at the anterior border of masseter \u2014 stay above platysma."],structures:["vii-marginal","a-facial","v3-mental","vii-cervical"],sensory:"Mental n. and buccal n. (V3) anteriorly; great auricular n. (C2\u2013C3) at the angle.",artery:"Facial a. and its submental branch.",lymph:"Submandibular nodes; parotid tail / upper jugular (level II) nodes near the angle.",plane:"Subcutaneous fat above platysma and the SMAS.",notes:["Feel for the facial artery pulse at the antegonial notch before you start; the nerve crosses there.","In thin, elderly patients platysma may be only a few fibres thick.","The mandibular border hides scars well."],repair:["Primary closure along the jawline.","Advancement or rotation from the lax neck and lower cheek."]},"h-submental":{auc:"M",aucNote:"neck",structures:["vii-marginal","vii-cervical"],sensory:"Transverse cervical n. (C2\u2013C3); mylohyoid n. twig.",artery:"Submental a. (from the facial a.).",lymph:"Submental nodes (level Ia).",plane:"Subcutaneous fat above platysma. In the midline the platysma may be deficient and the anterior jugular veins are superficial.",repair:["Primary closure in the submental crease or along horizontal neck lines."]},"fa-ear":{auc:"H",structures:["c-great-auricular","v3-auriculotemporal","a-sta","a-posterior-auricular"],sensory:"Great auricular n. (C2\u2013C3): lower two-thirds, front and back, and the lobule. Auriculotemporal n. (V3): anterosuperior ear, tragus, helical root. Lesser occipital n. (C2): upper cranial surface. Concha and canal: auricular branch of the vagus (Arnold's n.) with contributions from VII and IX.",artery:"Superficial temporal a. (anterior auricular branches) and posterior auricular a., joined by perforators through the cartilage.",lymph:"Anterior surface and tragus to parotid (preauricular) nodes; posterior surface and helix to postauricular (mastoid) nodes; lobule to infra-auricular / upper jugular (level II) nodes.",plane:"Just above perichondrium. On the lateral surface the skin is thin and tightly bound to cartilage; on the cranial surface there is a mobile subcutaneous layer.",notes:["Ring block: infiltrate around the base of the ear (above, in front of and behind). The concha and canal need separate local infiltration.","Cartilage is avascular and depends on perichondrium \u2014 a graft needs intact perichondrium, or cartilage windows through to the posterior soft tissue.","Keep the wound moist; chondritis is painful and slow to settle. Squamous cell carcinoma of the ear has a higher metastatic risk than at most skin sites.","Double-click the ear for its subunits

rly, looser on the back of the rim.","Ear height can drop by about 1.5 cm before asymmetry is obvious to others.","Cartilage struts that stick up beyond the skin edge should be trimmed back to prevent chondritis."],repair:["Secondary intention where perichondrium is intact; full-thickness graft.","Wedge excision for defects up to about 1.5 cm, with star-shaped (Burow's) extensions into the antihelix to prevent cupping.","Helical rim (chondrocutaneous) advancement flap, Antia\u2013Buch, for defects up to about 2\u20132.5 cm.","Staged postauricular interpolation (pedicle or tubed) flap, with cartilage graft if needed, for larger defects."]},"ear-helical-root":{like:"ear-helix",structures:["a-sta","v3-auriculotemporal"],alerts:[],notes:["The crus of the helix divides the concha into cymba and cavum.","Donor site for composite grafts to the alar rim.","The superficial temporal vessels and auriculotemporal nerve run just in front."],repair:["Secondary intention.","Full-thickness graft.","Preauricular transposition or advancement flap."]},"ear-scapha":{like:"fa-ear",structures:[],notes:["A concavity: heals well by secondary intention if perichondrium is intact.","If cartilage is bare, remove it or punch windows through it so that granulation can come from the posterior skin."],repair:["Secondary intention.","Full-thickness graft.","Postauricular pull-through or interpolation flap for large defects."]},"ear-antihelix":{like:"ear-scapha",notes:["A convex ridge: grafts take well on perichondrium; without it, remove the cartilage beneath a small defect or use a flap.","The antihelix provides most of the ear's structural support."],repair:["Full-thickness graft.","Secondary intention.","Postauricular pull-through (revolving-door) island flap; staged postauricular flap."]},"ear-superior-crus":{like:"ear-antihelix"},"ear-inferior-crus":{like:"ear-antihelix"},"ear-triangular-fossa":{like:"ear-scapha"},"ear-cymba":{like:"fa-ear",structures:[],sensory:"Auricular branch of the vagus (Arnold's n.) with facial and glossopharyngeal twigs; great auricular and auriculotemporal nn. at the edges. Not covered by a ring block \u2014 infiltrate locally.",notes:["Conchal bowl skin is a good full-thickness graft donor for the nasal tip and ala; conchal cartilage is the usual donor for alar battens.","Stimulating the vagal branch can provoke coughing or, rarely, a vasovagal episode.","Bare cartilage: excise it (the ear keeps its shape as long as the antihelix and helical root are preserved) so the wound granulates or accepts a graft from the posterior skin."],repair:["Secondary intention.","Full-thickness or split-thickness graft, often with a bolster.","Postauricular pull-through (revolving-door) island flap for large or full-thickness defects."]},"ear-cavum":{like:"ear-cymba"},"ear-meatus":{like:"ear-cymba",alerts:["Circumferential wounds of the canal contract \u2014 canal stenosis."],notes:["The outer third of the canal is cartilaginous with hair and ceruminous glands; the inner two-thirds is bony with very thin skin.","Tumour at the meatus can track along the canal and through the fissures of Santorini to the parotid; consider imaging and ENT review.","Stent or pack the canal after grafting."],repair:["Secondary intention for partial-circumference wounds.","Split- or full-thickness graft over a stent.","ENT referral for deep canal involvement."]},"ear-tragus":{like:"fa-ear",structures:["a-sta","v3-auriculotemporal","vii-trunk","parotid"],sensory:"Auriculotemporal n. (V3).",lymph:"Parotid (preauricular) nodes.",notes:["The tragal pointer (medial tip of the tragal cartilage) points towards the facial nerve trunk, about 1 cm deep and anteroinferior to it.","Tumours here can track down the pretragal fusion plane to the parotid and canal.","Tragal cartilage is a small graft donor."],repair:["Primary closure in the pretragal crease.","Preauricular advancement or transposition flap.","Full-thickness graft; secondary intention."]},"ear-antitragus":{like:"fa-ear",structures:["c-great-auricular"],sensory:"Great auricular n. (C2\u2013C3).",repair:["Secondary intention.","Full-thickness graft.","Primary closure or small wedge."]},"ear-lobule":{like:"fa-ear",structures:["c-great-auricular","vii-trunk"],sensory:"Great auricular n. (C2\u2013C3).",lymph:"Infra-auricular parotid and upper jugular (level II) nodes.",plane:"No cartilage \u2014 fibrofatty tissue only.",notes:["Lax and forgiving; up to half can be removed and closed directly.","Avoid a notch at the free edge: evert the closure or use a small Z-plasty at the rim.","The facial nerve trunk and parotid tail lie deep to the lobule's attachment."],repair:["Wedge excision with primary closure.","Secondary intention for small wounds.","Bilobed or folded flap from postauricular or infra-auricular skin for lobule reconstruction."]},"fa-anterior-neck":{auc:"M",structures:["c-transverse-cervical","vii-cervical"],sensory:"Transverse cervical n. (C2\u2013C3).",artery:"Superior thyroid, submental and transverse cervical branches via platysmal perforators.",lymph:"Anterior cervical and jugular chain nodes (levels I\u2013IV, VI).",plane:"Superficial fat above platysma. The anterior jugular veins run beneath platysma close to the midline.",notes:["Relaxed skin tension lines are horizontal; vertical scars over the neck contract into bands or webs.","Thin, lax skin: plenty of movement, but hypertrophic scars are common low on the neck and over the sternal notch."],repair:["Primary closure in a horizontal neck crease.","Advancement or rotation flaps; Z-plasty to break up vertical scars."]},"h-submandibular":{auc:"M",alerts:["Marginal mandibular nerve can lie up to 1\u20132 cm below the mandibular border here, just under platysma."],structures:["vii-marginal","a-facial","vii-cervical","c-transverse-cervical"],sensory:"Transverse cervical n. (C2\u2013C3).",artery:"Facial a. and its submental branch.",lymph:"Submandibular nodes (level Ib).",plane:"Superficial fat above platysma. The submandibular gland, facial vessels and the nerve are all beneath it.",notes:["Turning the head away and extending the neck pulls the nerve lower.","The facial vein crosses the gland superficially; the artery grooves its deep surface before hooking over the mandible."],repair:["Primary closure in a horizontal neck crease, at least 2 cm below the mandible where possible."]},"h-scm":{auc:"M",alerts:["Great auricular nerve and external jugular vein cross the muscle just under the skin."],structures:["c-great-auricular","v-external-jugular","xi-accessory","c-transverse-cervical","c-lesser-occipital"],sensory:"Great auricular n. (upper), transverse cervical n. (middle), supraclavicular nn. (lower).",artery:"Occipital, superior thyroid and transverse cervical branches.",lymph:"External jugular and deep jugular chain nodes (levels II\u2013IV).",plane:"Superficial fat above platysma and the investing fascia of sternocleidomastoid.",notes:["McKinney's point: the great auricular nerve crosses the mid-belly of the muscle 6.5 cm below the ear canal.","The midpoint of the muscle's posterior border is Erb's point, where the cervical plexus branches and the spinal accessory nerve emerge."],repair:["Primary closure along horizontal neck lines.","Advancement or rotation flaps."]},"h-posterior-triangle":{auc:"M",alerts:["Spinal accessory nerve crosses the posterior triangle just under the skin and investing fascia \u2014 superficial dissection only."],structures:["xi-accessory","c-supraclavicular","c-lesser-occipital","c-great-auricular","v-external-jugular","b-supraclavicular"],sensory:"Lesser occipital n. (upper), supraclavicular nn. (lower).",artery:"Transverse cervical and suprascapular aa.; occipital a. at the apex.",lymph:"Posterior triangle (level V) and supraclavicular nodes.",plane:"Superficial fat only. There is no platysma over most of the triangle, and the nerve lies on levator scapulae directly under the investing fascia.",notes:["Borders: posterior edge of sternocleidomastoid, anterior edge of trapezius, middle third of the clavicle.","Injury is most often reported after 'minor' procedures here: node biopsy, cyst and lipoma excision.","Test trapezius (shrug, abduct beyond 90\xB0) before and after surgery and document it."],repair:["Primary closure along relaxed skin tension lines.","Secondary intention or graft in preference to deep undermining."]},"h-posterolateral-neck":{auc:"M",structures:["xi-accessory","c-supraclavicular","c-lesser-occipital"],sensory:"Dorsal rami of C3\u2013C5; supraclavicular nn. laterally; lesser occipital n. above.",artery:"Transverse cervical a.; occipital a.",lymph:"Posterior triangle (level V), occipital and supraclavicular nodes.",plane:"Subcutaneous fat above the trapezius fascia.",notes:["Thick dermis and constant movement: scars over trapezius spread and may become hypertrophic.","The spinal accessory nerve enters the deep surface of trapezius along its anterior border, about 5 cm above the clavicle."],repair:["Primary closure along relaxed skin tension lines with strong buried sutures."]},"h-nuchal":{auc:"M",structures:["c-greater-occipital","a-occipital"],sensory:"Greater occipital n. (C2), third occipital n. (C3) and dorsal rami of C4\u2013C5.",artery:"Occipital a.; deep cervical and transverse cervical branches.",lymph:"Occipital nodes and posterior triangle (level V).",plane:"Subcutaneous fat above the trapezius fascia \u2014 the fat is fibrous and tethered to the dermis.",notes:["Very thick dermis with dense fibrous septa: wounds are stiff, gape, and scars spread.","Common site of acne keloidalis and epidermoid cysts."],repair:["Primary closure, horizontal, with strong buried sutures.","Secondary intention is acceptable."]},"ba-ant-neck":{like:"fa-anterior-neck"},"bp-nuchal":{like:"h-nuchal"},trunk:{auc:"L",sensory:"Segmental intercostal nn. \u2014 anterior and lateral cutaneous branches (see the dermatome views).",plane:"Deep subcutaneous fat, just above the muscular fascia.",notes:["Orient excisions along relaxed skin tension lines; if unsure, excise as a circle and see which way the wound gapes."],repair:["Primary fusiform closure with buried dermal sutures.","Secondary intention or graft only if closure is not possible."]},"ba-presternal":{like:"trunk",alerts:["High risk of hypertrophic and keloid scarring."],lymph:"Axillary nodes (either side); internal mammary nodes possible.",notes:["The presternal skin is tight, moves with breathing, and scars badly \u2014 warn the patient.","Horizontal closure generally gives the least tension."]},"ba-supraclav":{like:"trunk",auc:"M",aucNote:"neck",structures:["b-supraclavicular","c-supraclavicular","xi-accessory","v-external-jugular"],lymph:"Supraclavicular and level V nodes.",plane:"Superficial fat above platysma."},"ba-clavicle":{like:"trunk",structures:["c-supraclavicular"],lymph:"Axillary and supraclavicular nodes.",notes:["Thin skin directly over bone; the supraclavicular nerves cross the clavicle just under platysma.","Scars here often become hypertrophic."]},"ba-pectoral":{like:"trunk",lymph:"Axillary nodes.",notes:["Upper chest and shoulder scars spread and commonly become hypertrophic or keloidal.","Orient along the relaxed skin tension lines, which run roughly horizontal on the upper chest."]},"ba-breast":{like:"trunk",auc:"H",aucNote:"nipple\u2013areola only; the rest of the breast is area L",lymph:"Axillary nodes; medial breast also to internal mammary nodes.",notes:["Curvilinear closures along Langer's lines of the breast (circumareolar near the areola, radial further out) distort least.","Keep the nipple position symmetric; avoid tension that displaces the areola."]},"ba-axilla":{like:"trunk",structures:["b-axilla"],lymph:"Axillary nodes.",plane:"Subcutaneous fat above the axillary fascia.",notes:["Moist, hair-bearing, apocrine skin with a higher infection rate.","Orient scars transversely in the axillary folds; vertical scars contract into bands that limit abduction."]},"ba-lat-chest":{like:"trunk",lymph:"Axillary nodes.",notes:["The long thoracic and thoracodorsal nerves run deep on the chest wall and are not at risk in skin surgery.","Relaxed skin tension lines follow the ribs."]},"ba-epigastric":{like:"trunk",lymph:"Axillary nodes (above the umbilicus)."},"ba-upper-abdomen":{like:"trunk",lymph:"Axillary nodes (above the umbilicus)."},"ba-umbilical":{like:"trunk",lymph:"Watershed at the umbilicus: axillary nodes above, inguinal nodes below, either side.",notes:["Sappey's line (through the umbilicus to L2) divides axillary from inguinal drainage; lesions near it or the midline drain unpredictably.","Keep the umbilicus central when closing."]},"ba-flank":{like:"trunk",lymph:"Axillary nodes above the umbilical level, inguinal nodes below."},"ba-lower-abdomen":{like:"trunk",lymph:"Superficial inguinal nodes.",notes:["The superficial epigastric and circumflex iliac vessels run in the fat of the lower abdomen."]},"ba-suprapubic":{like:"trunk",lymph:"Superficial inguinal nodes, either side."},"ba-hip":{like:"trunk",lymph:"Superficial inguinal nodes.",notes:["The lateral femoral cutaneous nerve passes under the inguinal ligament just medial to the anterior superior iliac spine and becomes subcutaneous about 10 cm below it."]},"ba-inguinal":{like:"trunk",structures:["b-femoral"],lymph:"Superficial inguinal nodes.",notes:["Intertriginous skin: higher infection and dehiscence risk; close along the crease.","Divided lymphatics here can cause a lymphocele."]},"ba-pubic":{like:"trunk",auc:"H",aucNote:"genitalia, including perineal and perianal skin",lymph:"Superficial inguinal nodes, either side.",plane:"Subcutaneous (above dartos / Colles' fascia on the genitalia).",notes:["Tissue-sparing surgery matters for function; HPV-related squamous cell carcinoma in situ is often multifocal.","Very lax, vascular skin: bruising and oedema are common, healing is quick."],repair:["Primary closure.","Secondary intention heals well on genital skin.","Split- or full-thickness graft for larger defects."]},"bp-interscap":{like:"trunk",alerts:["Scars on the upper back spread widely and may become hypertrophic."],lymph:"Axillary nodes, either side near the midline.",notes:["Thickest dermis in the body; high wound tension with shoulder movement.","Use strong, long-lasting buried sutures, consider leaving skin sutures 2\u20133 weeks, and limit lifting and reaching."]},"bp-suprascap":{like:"bp-interscap",structures:["xi-accessory"],lymph:"Axillary nodes; level V / supraclavicular nodes near the neck."},"bp-scapular":{like:"bp-interscap",lymph:"Axillary nodes."},"bp-post-axilla":{like:"trunk",lymph:"Axillary nodes."},"bp-thoracic":{like:"bp-interscap",lymph:"Axillary nodes, either side."},"bp-midback":{like:"bp-interscap",lymph:"Axillary nodes."},"bp-post-flank":{like:"trunk",lymph:"Axillary nodes above the L2 level, inguinal nodes below."},"bp-lumbar":{like:"trunk",lymph:"Watershed (Sappey's line at about L2): axillary or inguinal nodes, either side."},"bp-lowback":{like:"trunk",lymph:"Superficial inguinal nodes; axillary nodes above L2."},"bp-sacral":{like:"trunk",lymph:"Superficial inguinal nodes, either side.",notes:["Pressure- and shear-bearing skin over bone: off-load after surgery."]},"bp-natal-cleft":{like:"trunk",auc:"H",aucNote:"if perianal / perineal",lymph:"Superficial inguinal nodes, either side.",notes:["Moist, sheared, contaminated site: dehiscence and infection are common. Off-midline closure heals better than a midline scar in the cleft."]},"bp-perianal":{like:"ba-pubic",notes:["The external anal sphincter lies just under the perianal skin; circumferential excision risks stenosis.","Lesions crossing the anal verge need anoscopy and usually colorectal input.","Secondary intention heals well here."]},"bp-buttock":{like:"trunk",lymph:"Superficial inguinal nodes.",notes:["Weight-bearing: sitting stresses the wound. Close along the gluteal fold lines and use strong buried sutures.","The sciatic nerve is deep to gluteus maximus and not at risk in skin surgery."]},limb:{auc:"L",plane:"Deep subcutaneous fat above the muscular fascia; cutaneous nerves and superficial veins run in the deep fat.",notes:["Relaxed skin tension lines on the limbs are often oblique or circumferential; longitudinal closures are sometimes preferred because they follow the lymphatics and are easier to close \u2014 pinch the skin to decide.","Avoid closing across joints in the line of flexion."],repair:["Primary fusiform closure.","Secondary intention.","Split- or full-thickness skin graft."]},"ba-deltoid":{like:"limb",alerts:["Shoulder scars spread and commonly become hypertrophic or keloidal."],lymph:"Axillary nodes.",sensory:"Supraclavicular nn. (C3\u2013C4) over the top; upper lateral cutaneous n. of arm (axillary n., C5).",notes:["High-tension, mobile site: use strong buried sutures and restrict reaching and lifting for 2\u20133 weeks.","The axillary nerve is deep to deltoid, about 5 cm below the acromion \u2014 not at risk in skin surgery."]},"bp-post-shoulder":{like:"ba-deltoid"},"ba-uparm":{like:"limb",lymph:"Axillary nodes.",sensory:"Upper and lower lateral cutaneous nn. of arm (lateral); medial cutaneous n. of arm and intercostobrachial n. (medial)."},"ba-med-uparm":{like:"limb",lymph:"Axillary nodes; epitrochlear node just above the medial epicondyle.",sensory:"Medial cutaneous n. of arm; intercostobrachial n. (T2).",notes:["Thin, lax skin. The basilic vein and medial antebrachial cutaneous nerve pierce the fascia in the middle of the medial arm; the brachial artery, median and ulnar nerves lie just beneath the fascia in the bicipital groove."]},"bp-post-uparm":{like:"limb",lymph:"Axillary nodes.",sensory:"Posterior cutaneous n. of arm (radial n.)."},"ba-antecub":{like:"limb",structures:["b-antecubital"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Medial and lateral antebrachial cutaneous nn."},"bp-elbow":{like:"limb",structures:["b-ulnar-elbow"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Posterior cutaneous n. of forearm; medial antebrachial cutaneous n.",notes:["Skin over the olecranon is lax in extension and tight in flexion \u2014 close with the elbow partly flexed.","The olecranon bursa lies just under the skin; entering it risks a chronic sinus.","High dehiscence risk: consider splinting in the first week."]},"ba-volar-forearm":{like:"limb",lymph:"Axillary nodes; epitrochlear node (ulnar side).",sensory:"Medial and lateral antebrachial cutaneous nn.",notes:["Thin skin with visible veins; actinic damage is usually less than on the dorsal side."]},"bp-dorsal-forearm":{like:"limb",lymph:"Axillary nodes; epitrochlear node (ulnar side).",sensory:"Posterior cutaneous n. of forearm (radial n.); lateral and medial antebrachial cutaneous nn. at the edges.",structures:["b-radial-sensory"],notes:["Atrophic, sun-damaged skin tears easily in the elderly: use wide, shallow bites, pulley or horizontal mattress sutures, and adhesive strips to reinforce.","Closure in the long axis of the forearm is often easiest; second-intention healing and grafts also do well."]},"ba-volar-wrist":{like:"limb",structures:["b-volar-wrist","b-radial-sensory"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Palmar cutaneous branches of the median and ulnar nn.; lateral antebrachial cutaneous n.",plane:"Just beneath the dermis.",notes:["Close transversely in the wrist creases; longitudinal scars across the crease contract."]},"bp-dorsal-wrist":{like:"limb",structures:["b-radial-sensory","b-dorsal-hand"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Superficial radial n. (radial side), dorsal branch of ulnar n. (ulnar side).",plane:"Just beneath the dermis, above the veins and the extensor retinaculum."},hand:{auc:"H",lymph:"Epitrochlear node (ulnar side) and axillary nodes.",plane:"Just beneath the dermis.",notes:["Function comes first: plan closures that do not limit joint movement, and splint or bulky-dress for comfort.","Elevate after surgery; oedema is the main cause of pain and stiffness."],repair:["Primary closure along skin creases.","Secondary intention.","Full-thickness graft."]},"bp-dorsal-hand":{like:"hand",structures:["b-dorsal-hand","b-radial-sensory"],sensory:"Superficial radial n. (radial), dorsal branch of ulnar n. (ulnar).",notes:["Thin, mobile skin over veins and extensor tendons; test closure with the fist clenched.","Transverse or oblique closures follow the skin lines; preserve paratenon if a graft may be needed.","Squamous cell carcinoma here is common and often multiple in the immunosuppressed."]},"ba-palm":{like:"hand",structures:["b-volar-wrist","b-digital"],sensory:"Median n. (radial three and a half digits and palm), ulnar n. (ulnar one and a half); palmar cutaneous branches proximally.",plane:"Above the palmar aponeurosis. Glabrous skin is tethered by fibrous septa and barely undermines.",notes:["The recurrent motor branch of the median nerve is superficial at the base of the thenar eminence.","The superficial palmar arch lies level with the distal border of the outstretched thumb.","Incisions should follow or zig-zag across the flexion creases, never cross them at right angles."],repair:["Secondary intention \u2014 glabrous skin heals well.","Primary closure along creases.","Full-thickness graft (hypothenar or instep skin for glabrous match)."]},"ba-thumb":{like:"hand",auc:"H",structures:["b-digital","b-radial-sensory"],sensory:"Median n. (palmar) and superficial radial n. (dorsal); digital nerves on each side.",notes:["Preserve length and pulp sensation above all.","For nail-unit tumours, bone lies 1\u20132 mm below the nail bed; en bloc nail-unit excision with full-thickness graft is the usual tissue-sparing option."]},"ba-fingers":{like:"hand",structures:["b-digital"],sensory:"Proper palmar digital nn. (median: thumb to radial half of ring finger; ulnar: ulnar half of ring and little finger).",notes:["Use mid-lateral or Bruner zig-zag incisions on the palmar side; never a straight line across a flexion crease.","Digital block: adrenaline-containing lidocaine is considered safe in digits with normal circulation; keep volumes small (2\u20133 mL) and tourniquet time short."]},"bp-dorsal-fingers":{like:"hand",aucNote:"includes the nail unit",structures:["b-digital","b-dorsal-hand"],sensory:"Dorsal digital nn. (radial and ulnar) proximally; palmar digital nn. supply the dorsum distal to the PIP joint and the nail unit.",notes:["Nail unit: the matrix lies under the proximal nail fold and extends to within a few millimetres of the DIP joint; its proximal (dorsal) part makes the surface of the plate, so matrix scars cause split or ridged nails.","The extensor tendon inserts about 1.2 cm proximal to the cuticle. Bone is 1\u20132 mm under the nail bed.","Longitudinal melanonychia or erythronychia with nail dystrophy in one digit: think of nail-unit squamous cell carcinoma or melanoma."],repair:["Secondary intention (including the nail bed and lateral folds).","Full-thickness graft after en bloc nail-unit excision.","Primary closure; cross-finger and local flaps for exposed tendon or bone (hand surgery)."]},"nail-unit":{like:"hand",aucNote:"nail unit",alerts:["Bone lies 1\u20132 mm beneath the nail bed and matrix; the extensor tendon inserts just proximal to the matrix."],structures:["b-digital"],lymph:"Fingers: epitrochlear node (ulnar digits) and axillary nodes. Toes: superficial inguinal nodes.",sensory:"Proper palmar (plantar) digital nn., via their dorsal branches. A digital block at the base of the digit anaesthetises the whole nail unit.",artery:"Paired digital arteries forming the proximal and distal arcades in the nail bed.",plane:"None \u2014 nail bed and matrix dermis attach directly to the periosteum of the distal phalanx.",notes:["Parts: proximal nail fold and cuticle, matrix (the lunula is its visible distal part), nail bed, hyponychium, lateral nail folds.","The matrix extends about 5 mm proximal to the cuticle, to within a few millimetres of the extensor tendon insertion and the DIP joint.","The proximal matrix forms the surface of the plate and the distal matrix its underside: biopsy the distal matrix where possible, orient matrix excisions transversely, and keep longitudinal matrix defects under 3 mm to avoid a split nail.","Nail bed biopsies are oriented longitudinally.","A single-digit longitudinal pigmented band that is wide, dark, irregular or spreading on to the nail fold (Hutchinson's sign), or a persistent wart-like or oozing lesion, needs a matrix or bed biopsy."],repair:["Secondary intention for the nail bed and lateral folds.","En bloc nail-unit excision down to periosteum, repaired with a full-thickness skin graft or left to granulate.","Amputation is reserved for bone involvement."]},"nu-proximal-fold":{like:"nail-unit",alerts:["The extensor tendon inserts about 12 mm proximal to the cuticle \u2014 incisions and injections proximal to the fold are close to it."],notes:["A wedge of skin whose undersurface (eponychium) lies on the newly formed plate and covers the proximal matrix.","To expose the matrix, make oblique relaxing incisions at the junctions of the proximal and lateral folds and reflect the fold proximally.","A crescentic full-thickness excision of the free edge of the fold (for chronic paronychia or small tumours) heals well by secondary intention.","Common site of digital myxoid cysts, which connect to the DIP joint and press a groove into the plate."],repair:["Secondary intention.","Replace the reflected fold and suture the relaxing incisions.","Full-thickness graft for larger defects."]},"nu-cuticle":{like:"nail-unit",alerts:[],notes:["A layer of keratin from the proximal nail fold that seals the fold to the plate.","Loss of the seal (trauma, manicuring, wet work) lets irritants and organisms in: chronic paronychia.","Pigment extending on to the cuticle or fold from a pigmented band is Hutchinson's sign."],repair:["Re-forms as the fold heals; protect from wet work meanwhile."]},"nu-lateral-fold":{like:"nail-unit",alerts:[],notes:["The lateral horns of the matrix extend proximally and laterally beneath the junction of the proximal and lateral folds \u2014 they must be included in a matricectomy or a spicule regrows.","Lateral longitudinal excision (fold, plate edge, bed and matrix horn down to bone, 3\u20134 mm wide) is the standard biopsy for lesions in the lateral third of the nail.","The digital nerve and artery run just palmar to the fold."],repair:["Secondary intention.","Suture the fold back to the plate edge after lateral longitudinal excision."]},"nu-matrix":{like:"nail-unit",alerts:["Matrix scars cause permanent nail dystrophy: a split from the proximal matrix, a thin or ridged plate from the distal matrix."],notes:["The matrix makes the plate. It starts just distal to the extensor tendon insertion, lies under the proximal nail fold, and ends at the distal edge of the lunula.","The proximal matrix forms the top of the plate and the distal matrix (lunula) its underside \u2014 so distal-matrix biopsies leave least deformity.","Punch biopsies up to 3 mm heal without a split; orient excisions transversely (parallel to the lunula border).","For longitudinal melanonychia, find the origin of the band in the matrix: a tangential (shave) matrix biopsy samples a wide band with little dystrophy.","Matrix melanocytes are mostly dormant; activation gives a longitudinal pigmented band."],repair:["Leave punch defects up to 3 mm to heal.","Close transverse matrix defects with fine absorbable sutures after undermining.","Replace the plate as a biological dressing."]},"nu-bed":{like:"nail-unit",alerts:["Bone is 1\u20132 mm beneath the bed, with no subcutaneous fat between."],notes:["The bed holds the plate down by interlocking longitudinal ridges; it adds little to plate thickness.","Orient bed biopsies longitudinally. Punches up to 4 mm and narrow longitudinal ellipses heal by secondary intention.","Scarring of the bed causes onycholysis rather than a split.","A persistent warty, oozing or onycholytic lesion of one nail should be biopsied for squamous cell carcinoma; image the phalanx if the bed is involved."],repair:["Secondary intention.","Fine absorbable sutures for longitudinal defects.","Full-thickness graft after en bloc nail-unit excision."]},"nu-plate":{like:"nail-unit",alerts:[],structures:[],notes:["Fingernails grow about 3 mm a month (full regrowth in about 6 months); toenails about 1 mm a month (12\u201318 months for the great toenail).","Partial avulsion (lateral, proximal or a trap-door) gives access with less morbidity than total avulsion.","Separate the plate from the bed and from the proximal fold with a blunt elevator before lifting it.","A punch through the softened plate (two-punch technique) reaches the bed or matrix without avulsion."],repair:["Replace the trimmed plate as a splint and dressing where possible."]},"nu-hyponychium":{like:"nail-unit",alerts:[],notes:["The seal between the distal nail bed and the fingertip, under the free edge; the onychodermal band marks its proximal limit.","Disrupting it causes onycholysis and lets organisms under the plate.","Subungual warts and squamous cell carcinoma often start here or in the lateral groove."],repair:["Secondary intention."]},"nu-pulp":{like:"nail-unit",aucNote:"hand / foot",alerts:[],plane:"Fat is divided into compartments by fibrous septa running from the dermis to the periosteum; undermining is limited.",notes:["Each digital nerve ends by dividing into three branches just distal to the DIP crease, supplying the pulp, the nail bed and the dorsal tip.","The digital arteries join in an arcade over the tuft of the phalanx.","Preserve pulp sensation and padding: glabrous skin heals well by secondary intention."],repair:["Secondary intention (defects up to about 1 cm without exposed bone).","Full-thickness graft from the hypothenar eminence.","V\u2013Y advancement or other local flaps for exposed bone (hand surgery)."]},"nu-phalanx":{like:"nail-unit",structures:[],notes:["The matrix and bed lie directly on the periosteum of the distal phalanx.","X-ray before surgery for subungual tumours: look for exostosis, erosion or invasion.","Bone involvement by squamous cell carcinoma or melanoma usually means amputation at or proximal to the DIP joint."],repair:[]},"nu-extensor":{like:"nail-unit",alerts:["Dividing the terminal extensor tendon causes a mallet (dropped) fingertip."],structures:[],notes:["Inserts on the dorsal base of the distal phalanx about 12 mm proximal to the cuticle; the proximal edge of the matrix is about 1 mm distal to the insertion.","Only skin and paratenon cover it over the DIP joint."],repair:["A divided tendon needs splinting in extension or repair \u2014 hand surgery."]},"nu-dip":{like:"nail-unit",aucNote:"hand / foot",alerts:["The joint capsule and extensor tendon lie directly under thin dorsal skin."],notes:["Digital myxoid (mucous) cysts arise from the DIP joint, usually over an osteophyte; surgery must deal with the stalk to the joint.","Entering the joint risks septic arthritis.","Close dorsal wounds with the joint extended, or accept secondary intention."],repair:["Secondary intention.","Full-thickness graft over intact paratenon.","Local rotation or transposition flap for exposed tendon or joint."]},leg:{like:"limb",lymph:"Superficial inguinal nodes.",notes:["Healing is slower below the knee: more dehiscence, infection and prolonged oedema. Elevate and compress after surgery.","Check pulses, venous disease and oedema before choosing between closure, graft and secondary intention."]},"ba-ant-thigh":{like:"leg",sensory:"Anterior cutaneous branches of the femoral n.; lateral femoral cutaneous n. laterally.",notes:["Thick fat and a good blood supply: primary closure is usually straightforward."]},"ba-med-thigh":{like:"leg",structures:["b-femoral","b-saphenous"],sensory:"Obturator n. and medial cutaneous branches of the femoral n.",notes:["The great saphenous vein runs up the medial thigh in the subcutaneous fat to the saphenofemoral junction.","Thin, lax skin; friction and moisture increase wound problems."]},"ba-lat-thigh":{like:"leg",sensory:"Lateral femoral cutaneous n. (L2\u2013L3).",notes:["The iliotibial tract lies under the fat; skin here is tight and scars spread."]},"bp-post-thigh":{like:"leg",sensory:"Posterior femoral cutaneous n. (S1\u2013S3).",notes:["Wounds are stressed by sitting; use strong buried sutures."]},"ba-knee":{like:"leg",structures:["b-peroneal","b-saphenous"],sensory:"Anterior femoral cutaneous nn.; infrapatellar branch of the saphenous n. (crosses below the patella from medial to lateral).",notes:["Skin over the patella is tight in flexion: close with the knee slightly bent and consider a splint for the first week.","The prepatellar bursa lies just beneath the skin.","Dividing the infrapatellar branch of the saphenous nerve leaves a numb patch lateral to the scar, sometimes a neuroma."]},"bp-popliteal":{like:"leg",structures:["b-popliteal","b-peroneal","b-sural"],sensory:"Posterior femoral cutaneous n.",lymph:"Popliteal nodes, then inguinal nodes."},"ba-shin":{like:"leg",auc:"M",aucNote:"pretibial surface",alerts:["Pretibial skin heals slowly and closes under high tension \u2014 plan for it."],structures:["b-saphenous","b-peroneal"],sensory:"Saphenous n. (medial); lateral sural cutaneous and superficial peroneal nn. (lateral).",plane:"Above the deep fascia. Over the tibia there is almost no fat between skin and periosteum.",notes:["Tight, thin, poorly perfused skin over bone; oedema, venous disease and anticoagulation make it worse.","Compression (Unna boot or multilayer bandaging) and elevation after surgery improve healing by any method.","Grafts fail on bare cortical bone: preserve periosteum."],repair:["Primary closure in the long axis of the leg, often needing wide undermining above the fascia.","Secondary intention with compression \u2014 slow but reliable for small and medium wounds.","Purse-string or partial closure to shrink the wound.","Split- or full-thickness (including pinch) grafts; keystone or bilateral advancement flaps for selected defects."]},"ba-lat-leg":{like:"ba-shin",auc:"L",aucNote:"",alerts:[],structures:["b-peroneal","b-dorsal-foot"],sensory:"Lateral sural cutaneous n.; superficial peroneal n. (becomes subcutaneous in the distal third of the lateral leg).",plane:"Above the deep fascia."},"bp-calf":{like:"leg",structures:["b-sural","b-popliteal"],sensory:"Medial and lateral sural cutaneous nn.; saphenous n. medially.",lymph:"Superficial inguinal nodes; popliteal nodes (posterolateral calf and heel).",notes:["The small saphenous vein and sural nerve run up the midline of the calf, piercing the fascia in its middle third.","More fat and laxity than the shin; primary closure is usually possible. Compress and elevate."]},ankle:{like:"leg",auc:"H",aucNote:"ankle",plane:"Just beneath the dermis \u2014 there is little subcutaneous fat.",notes:["Thin skin over tendon and bone with poor laxity and slow healing; immobilise and compress.","Secondary intention and grafts are used more often here than elsewhere."],repair:["Secondary intention.","Full- or split-thickness graft over intact paratenon or periosteum.","Primary closure for small defects."]},"ba-ant-ankle":{like:"ankle",structures:["b-dorsal-foot","b-saphenous"],sensory:"Superficial peroneal n.; saphenous n. medially."},"ba-med-malleolus":{like:"ankle",structures:["b-saphenous"],sensory:"Saphenous n. (L3\u2013L4).",notes:["The great saphenous vein and saphenous nerve cross just in front of the malleolus; the posterior tibial artery and tibial nerve run behind it in the tarsal tunnel.","The commonest site of venous ulceration \u2014 look for venous disease and compress."]},"ba-lat-malleolus":{like:"ankle",structures:["b-sural"],sensory:"Sural n. (S1).",notes:["The sural nerve and small saphenous vein pass behind the malleolus.","Pressure from footwear slows healing; pad the area."]},"bp-achilles":{like:"ankle",structures:["b-sural"],sensory:"Sural n. (lateral); medial calcaneal branches of the tibial n.",notes:["Skin lies directly on the Achilles paratenon \u2014 preserve it. Plantar-flexion splinting protects a closure here."]},foot:{like:"leg",auc:"H",plane:"Just beneath the dermis.",notes:["Check dorsalis pedis and posterior tibial pulses, capillary refill and sensation; arrange vascular assessment before surgery if pulses are absent.","Off-load and elevate; allow longer before removing sutures (2\u20133 weeks)."],repair:["Secondary intention.","Full-thickness graft.","Primary closure where there is laxity."]},"ba-dorsal-foot":{like:"foot",structures:["b-dorsal-foot","b-saphenous","b-sural"],sensory:"Superficial peroneal n.; deep peroneal n. (first web space); saphenous n. (medial border); sural n. (lateral border).",lymph:"Superficial inguinal nodes; lateral border may drain to popliteal nodes."},"ba-toes":{like:"foot",structures:["b-digital"],sensory:"Dorsal and plantar digital nn.",notes:["Nail unit anatomy as for the fingers: matrix under the proximal nail fold, bone 1\u20132 mm under the nail bed.","Acral lentiginous melanoma and nail-unit squamous cell carcinoma present here \u2014 biopsy persistent pigmented bands and non-healing 'ingrown' nails.","Digital block as for fingers."]},"bp-heel":{like:"foot",sensory:"Medial calcaneal branches of the tibial n.; sural n. laterally. The sole: medial and lateral plantar nn.",lymph:"Superficial inguinal nodes; popliteal nodes from the lateral heel.",plane:"Above the plantar fascia. Thick glabrous skin is anchored by fibrous septa and barely undermines.",notes:["Weight-bearing skin: strict off-loading (crutches, heel-relief shoe) until healed.","Plantar wounds heal well by secondary intention; grafts of non-glabrous skin break down under load.","Posterior tibial nerve block at the medial malleolus anaesthetises most of the sole and is far less painful than plantar infiltration."],repair:["Secondary intention.","Primary closure along the skin creases.","Glabrous full-thickness graft from the instep; local flaps for weight-bearing defects (specialist)."]}},iw={"ba-supraclav":["b-supraclavicular","c-supraclavicular","xi-accessory","v-external-jugular"],"ba-clavicle":["c-supraclavicular","v-cephalic"],"ba-deltoid":["v-cephalic","n-axillary","c-supraclavicular"],"bp-post-shoulder":["n-axillary"],"ba-axilla":["b-axilla","n-intercostobrachial","a-brachial"],"ba-uparm":["v-cephalic","n-radial"],"ba-med-uparm":["a-brachial","n-median","n-ulnar","v-basilic","n-mabc","n-intercostobrachial"],"bp-post-uparm":["n-radial","n-axillary"],"ba-antecub":["b-antecubital","a-brachial","n-median","v-basilic","v-cephalic","n-mabc","n-labc"],"bp-elbow":["b-ulnar-elbow","n-ulnar","n-mabc"],"ba-volar-forearm":["a-radial","v-cephalic","v-basilic","n-labc","n-mabc","n-median"],"bp-dorsal-forearm":["b-radial-sensory","v-cephalic","n-dorsal-ulnar"],"ba-volar-wrist":["b-volar-wrist","a-radial","n-median","n-ulnar","a-ulnar","b-radial-sensory"],"bp-dorsal-wrist":["b-radial-sensory","n-dorsal-ulnar","v-cephalic","b-dorsal-hand"],"bp-dorsal-hand":["b-dorsal-hand","b-radial-sensory","n-dorsal-ulnar","v-cephalic"],"ba-palm":["b-recurrent-median","a-palmar-arch","n-median","n-ulnar","b-digital"],"ba-thumb":["b-digital","b-recurrent-median","b-radial-sensory"],"ba-inguinal":["b-femoral","a-femoral","n-femoral","v-great-saphenous","n-lfcn"],"ba-hip":["n-lfcn"],"ba-ant-thigh":["n-lfcn","a-femoral","n-femoral"],"ba-med-thigh":["v-great-saphenous","a-femoral","b-femoral"],"ba-lat-thigh":["n-lfcn"],"bp-buttock":["n-sciatic","n-pfcn"],"bp-post-thigh":["n-pfcn","n-sciatic"],"ba-knee":["b-peroneal","b-saphenous","v-great-saphenous"],"bp-popliteal":["b-popliteal","b-peroneal","n-tibial","a-popliteal","v-small-saphenous","b-sural"],"ba-shin":["v-great-saphenous","b-saphenous","n-superficial-peroneal"],"ba-lat-leg":["b-peroneal","n-superficial-peroneal"],"bp-calf":["b-sural","v-small-saphenous","v-great-saphenous","n-tibial"],"ba-ant-ankle":["n-superficial-peroneal","a-anterior-tibial","n-deep-peroneal","b-saphenous"],"ba-med-malleolus":["b-saphenous","v-great-saphenous","a-posterior-tibial","n-tibial"],"ba-lat-malleolus":["b-sural","v-small-saphenous","n-superficial-peroneal"],"bp-achilles":["b-sural","v-small-saphenous","a-posterior-tibial","n-tibial"],"ba-dorsal-foot":["b-dorsal-foot","n-superficial-peroneal","a-anterior-tibial","n-deep-peroneal","b-saphenous","b-sural"],"bp-heel":["n-tibial","a-posterior-tibial","n-plantar","b-sural"]};for(let[e,t]of Object.entries(iw))kc[e]={...kc[e],structures:t};var cv=(e,t=new Set)=>{let n=kc[e];if(!n)return null;if(!n.like||t.has(e))return n;t.add(e);let{like:a,...r}=n;return{...cv(a,t),...r}},uv=Object.fromEntries(Object.keys(kc).map(e=>[e,cv(e)])),dv={H:{label:"Area H",color:"#b3261e",text:"High-risk anatomic area in the Mohs appropriate use criteria: central face, eyelids, eyebrows, nose, lips, chin, ear, periauricular skin, temple; genitalia; hands, feet, nail units, ankles; nipples and areolae."},M:{label:"Area M",color:"#a86400",text:"Intermediate-risk area in the Mohs appropriate use criteria: cheeks, forehead, scalp, neck, jawline, pretibial surface."},L:{label:"Area L",color:"#4a7046",text:"Lower-risk area in the Mohs appropriate use criteria: trunk and extremities (excluding pretibial surface, hands, feet, nail units and ankles)."}},wc=e=>e&&(uv[e.baseId]||uv[e.infoKey])||null;var Sc=ne(hi(),1);var pv=e=>"https://www.ncbi.nlm.nih.gov/books/?term="+encodeURIComponent(e.find||e.term),Ba=[{term:"SMAS",also:["superficial musculoaponeurotic system"],def:"Superficial musculoaponeurotic system: a fibromuscular sheet under the facial fat that links the facial muscles to the skin. It is continuous with platysma below, the superficial temporal fascia above and the galea on the scalp. Facial nerve branches run beneath it, so undermining in the fat above it is safe.",find:"superficial musculoaponeurotic system"},{term:"Superficial temporal fascia",also:["temporoparietal fascia","superficial temporal (temporoparietal) fascia"],def:"The temple's continuation of the SMAS: a thin sheet just under the subcutaneous fat. The superficial temporal vessels run in it and the temporal branch of the facial nerve runs on its deep surface, which is why temple undermining stays in the fat above it.",find:"temporoparietal fascia"},{term:"Deep temporal fascia",def:"The dense, shiny white fascia that covers the temporalis muscle. It lies deeper than the temporal branch of the facial nerve, so reaching it means the nerve's layer has already been crossed."},{term:"Galea",also:["galea aponeurotica","galeal"],def:"The tough fibrous sheet of the scalp that joins the frontalis and occipitalis muscles. It is the scalp's equivalent of the SMAS and is the layer that holds tension in a scalp closure.",find:"galea aponeurotica scalp anatomy"},{term:"Subgaleal plane",also:["subgaleal"],def:"The loose areolar layer between the galea and the pericranium. It is nearly bloodless and separates easily, so it is the standard plane for undermining the scalp.",find:"scalp layers"},{term:"Galeotomy",also:["galeotomies"],def:"A relaxing incision through the galea only, made on the underside of a scalp flap parallel to the wound edge. Each one lets the stiff scalp stretch a few millimetres."},{term:"Pericranium",def:"The periosteum of the skull. A skin graft will take on pericranium but not on bare bone."},{term:"Periosteum",def:"The thin vascular membrane covering bone. It nourishes the outer bone and will support a skin graft or granulation tissue; bare bone without it will not."},{term:"Perichondrium",def:"The thin vascular membrane covering cartilage. Cartilage has no blood supply of its own, so a graft or granulation tissue needs intact perichondrium to survive on it."},{term:"Paratenon",def:"The thin, vascular gliding layer around a tendon. If it is preserved a skin graft will take over the tendon; a bare tendon dries out and the graft fails."},{term:"Platysma",def:"The thin, sheet-like muscle of the neck, lying just under the subcutaneous fat. The marginal mandibular and cervical branches of the facial nerve, the external jugular vein and the cutaneous nerves of the neck all run beneath it."},{term:"Investing fascia",also:["investing layer of deep cervical fascia","investing layer"],def:"The outermost layer of the deep fascia of the neck, wrapping sternocleidomastoid and trapezius and roofing the posterior triangle. In the posterior triangle it is the only layer, besides skin and fat, covering the spinal accessory nerve.",find:"deep cervical fascia"},{term:"Fascia lata",def:"The deep fascia of the thigh. The femoral vessels and nerve lie beneath it; the great saphenous vein and the cutaneous nerves lie on top of it."},{term:"Retaining ligaments",also:["retaining ligament","zygomatic retaining ligaments","masseteric ligaments","mandibular retaining ligament"],def:"Fibrous bands that anchor the facial skin to the underlying bone or fascia at fixed points (zygomatic, masseteric, mandibular). They limit how far a cheek flap will move until they are released.",find:"retaining ligaments of the face"},{term:"Modiolus",def:"The fibromuscular knot just lateral to the corner of the mouth where the muscles that move the lips converge. It works as the hub of the smile."},{term:"Undermining",also:["undermine","undermined","undermines"],def:"Freeing the skin around a wound from the tissue beneath it, in a chosen plane, so the edges can be advanced and closed with less tension. Each site has a preferred plane that avoids its nerves and vessels.",find:"undermining skin surgery technique"},{term:"Relaxed skin tension lines",also:["relaxed skin tension line","RSTL","skin tension lines"],def:"The lines along which resting skin is under least tension \u2014 roughly the direction of wrinkles, perpendicular to the pull of the underlying muscles. Scars placed along them are narrower and less visible.",find:"relaxed skin tension lines"},{term:"Free margin",also:["free margins"],def:"A skin edge with nothing on the other side to resist pull: eyelid, nostril rim, lip, helical rim. Tension towards a free margin distorts it (ectropion, alar notching, lip eversion), so closures are planned with tension running parallel to it."},{term:"Cosmetic subunit",also:["subunit principle","cosmetic subunits","aesthetic units","aesthetic unit"],def:"The face divides into units and subunits bounded by natural contour lines and shadows. Scars hidden at their borders are least noticeable; if a defect takes up most of a convex subunit, replacing the whole subunit often looks better than patching part of it.",find:"facial aesthetic subunits reconstruction"},{term:"Embryonic fusion plane",also:["embryonic fusion planes","fusion plane"],def:"A line where facial processes fused in the embryo (alar crease, melolabial fold, medial canthus, pre- and post-auricular sulci, philtrum). Tumours meeting little resistance can track deeply along these planes, so recurrence rates are higher and Mohs layers are often deeper than expected.",find:"embryonic fusion planes basal cell carcinoma"},{term:"Mohs AUC",also:["Mohs appropriate use criteria","appropriate use criteria","area H","area M","area L"],def:"The 2012 appropriate use criteria for Mohs surgery score a tumour by its type, size, patient factors and body area. Area H is the 'mask' of the face, genitalia, hands, feet, nails, ankles and nipples; area M is cheeks, forehead, scalp, neck, jawline and shin; area L is the rest of the trunk and limbs.",find:"Mohs micrographic surgery appropriate use criteria"},{term:"Secondary intention",also:["second intention","second-intention","granulate","granulation"],def:"Leaving a wound open to fill with granulation tissue, contract and re-epithelialise on its own. It works best on concave surfaces (temple, medial canthus, conchal bowl, alar groove) and needs a vascular wound bed.",find:"secondary intention healing"},{term:"Primary closure",also:["fusiform closure","fusiform"],def:"Closing a wound directly, edge to edge, usually after converting it to a fusiform (elliptical) shape about three times as long as it is wide so the ends lie flat."},{term:"Buried sutures",also:["buried dermal sutures","buried suture"],def:"Absorbable sutures placed in the dermis with the knot down, taking the tension off the skin edge and everting it. They do the real work of holding a wound together."},{term:"Pulley suture",also:["pulley or horizontal mattress sutures","horizontal mattress"],def:"Suture patterns that pass through each wound edge more than once to spread the load. They pull tight wounds together with less tearing of fragile, atrophic skin."},{term:"Guiding sutures",also:["guiding suture","partial closure"],def:"Sutures that close part of a wound, or draw its edges in, to shrink the area left to heal by secondary intention and to steer the direction of contraction."},{term:"Purse-string",also:["purse-string closure"],def:"A running suture placed around the rim of a round wound and tightened like a drawstring to make it smaller. It may close the wound fully or leave a small centre to granulate."},{term:"Burow's triangle",also:["Burow's","Burow's triangles"],def:"A triangle of redundant skin removed to let a flap advance or to flatten a standing cone ('dog ear'). It can be placed wherever along the flap edge it hides best."},{term:"Burow's graft",def:"A full-thickness skin graft made from the Burow's triangle or standing cone that would otherwise be discarded from the same wound, so the graft matches the neighbouring skin."},{term:"M-plasty",def:"Folding the tip of a fusiform excision in on itself as an 'M' so the scar ends short of a structure it would otherwise cross, such as the vermilion border or the lid margin."},{term:"Z-plasty",def:"Transposing two triangular flaps to lengthen a scar and change its direction. It is used to break up a straight scar that crosses a joint crease or concavity and would otherwise contract into a band."},{term:"Trapdoor (pin-cushion) deformity",also:["pin-cushion","pin-cushioning","trapdoor"],def:"Bulging of a flap or scar above the surrounding skin, typical of curved scars and of thick sebaceous skin on the nose and chin. Wide undermining and careful eversion reduce it."},{term:"Hypertrophic scar",also:["hypertrophic","keloid","keloidal"],def:"A raised scar. A hypertrophic scar stays within the wound and often settles; a keloid grows beyond it. Chest, shoulders, upper back and earlobes are the high-risk sites.",find:"keloid hypertrophic scar"},{term:"Bolster",def:"A tie-over dressing sutured on top of a skin graft to press it against the wound bed and stop blood or fluid lifting it off."},{term:"Dermabrasion",def:"Mechanical sanding of a scar or graft, usually 6\u20138 weeks after surgery, to blend its edges and texture with the surrounding skin."},{term:"Bipolar cautery",def:"Electrocautery in which current passes only between the two tips of the forceps. It is preferred near nerves, on the eyelids and in patients with implanted cardiac devices because the current does not spread through the tissue."},{term:"Full-thickness skin graft",also:["full-thickness graft","FTSG","full-thickness skin grafts","full-thickness grafts"],def:"Epidermis and the whole dermis, moved without its blood supply; the donor site is closed directly. It contracts little and matches colour and texture well if the donor site is chosen carefully (preauricular, postauricular, conchal bowl, supraclavicular, upper eyelid).",find:"full thickness skin graft"},{term:"Split-thickness skin graft",also:["split-thickness graft","STSG","split-thickness","Split- or full-thickness"],def:"Epidermis and part of the dermis, shaved from a donor site that heals on its own. It takes more readily than a full-thickness graft and covers large areas, but it contracts more and is thin, pale and shiny.",find:"split thickness skin graft"},{term:"Composite graft",also:["composite grafts"],def:"A graft of more than one tissue \u2014 usually skin with cartilage from the helical root or rim \u2014 used for small full-thickness defects of the alar rim. Survival is unreliable beyond about 1 cm from a blood supply."},{term:"Cartilage batten",also:["batten","battens","cartilage batten graft","free cartilage graft"],def:"A strip of cartilage (usually from the conchal bowl) placed under a flap or graft on the ala or sidewall. It is not replacing missing cartilage; it braces the soft tissue against scar contraction and airway collapse."},{term:"Dermal substitute",also:["Integra"],def:"A manufactured collagen matrix laid on a wound to grow a new vascular dermis-like layer, which can then be skin-grafted. Useful over bare bone or tendon."},{term:"Advancement flap",also:["advancement flaps","advancement"],def:"A flap that slides straight forward into the defect without turning. Examples are the single-sided U-plasty, the two-sided H-plasty, and A\u2013T / O\u2013T closures.",find:"advancement flap"},{term:"Rotation flap",also:["rotation flaps","rotation"],def:"A curved flap that pivots around a point into an adjacent defect. The arc needs to be long \u2014 several times the width of the defect \u2014 to move without tension.",find:"rotation flap"},{term:"Transposition flap",also:["transposition flaps","transposition"],def:"A flap lifted over a bridge of intact skin and set down in a nearby defect, bringing lax skin from another direction. Rhombic, bilobed and melolabial flaps are examples.",find:"transposition flap"},{term:"Rhombic flap",also:["rhombic","rhomboid flap","rhombic transposition"],def:"A transposition flap designed as a parallelogram next to the defect (Limberg, Dufourmentel and Webster variants). It moves tension to the donor site, at right angles to the original defect.",find:"rhomboid flap"},{term:"Bilobed flap",also:["bilobed","bilobed transposition flap"],def:"A double transposition flap: the first lobe fills the defect, a smaller second lobe fills the first lobe's donor site, and the last donor site is closed directly. Zitelli's design (about 45\xB0 between lobes, 90\u2013100\xB0 in total) is the standard repair for small defects of the distal nose.",find:"bilobed flap nasal reconstruction"},{term:"Trilobed flap",also:["trilobed"],def:"A bilobed flap with a third lobe, which lets tissue be recruited from further up the nose for defects of the far tip and ala with less distortion of the nostril rim."},{term:"Island pedicle flap",also:["island pedicle","V\u2013Y island pedicle flap","V\u2013Y island pedicle","V\u2013Y island","V\u2013Y advancement","V\u2013Y"],def:"A triangle of skin cut free all the way round and advanced into the defect on a pedicle of subcutaneous fat or muscle that carries its blood supply. The donor site closes as a line, turning the V into a Y.",find:"V-Y island pedicle advancement flap"},{term:"Interpolation flap",also:["interpolation","interpolation flaps"],def:"A flap from a donor site that is not next to the defect. Its pedicle bridges intact skin for about three weeks while the flap picks up a new blood supply, and is then divided at a second operation. Examples: paramedian forehead, melolabial and postauricular flaps.",find:"interpolation flap"},{term:"Paramedian forehead flap",also:["forehead flap"],def:"A two- or three-stage interpolation flap from the forehead, based on the supratrochlear artery at the medial brow. It is the workhorse for large or deep defects of the nasal tip, dorsum and ala.",find:"paramedian forehead flap"},{term:"Melolabial interpolation flap",also:["melolabial (nasolabial) transposition flap","melolabial transposition","nasolabial transposition","melolabial interpolation"],def:"Cheek skin from beside the melolabial fold moved to the ala. As a single-stage transposition it tends to blunt the alar groove; as a two-stage interpolation flap it keeps the groove and is preferred for whole-ala defects.",find:"melolabial flap nasal ala reconstruction"},{term:"Dorsal nasal (Rieger) flap",also:["dorsal nasal flap","Rieger","dorsal nasal (Rieger) rotation flap"],def:"A rotation flap of the whole skin of the nasal dorsum and glabella, pivoting on a pedicle near the medial canthus, to cover defects of the lower dorsum and tip.",find:"dorsal nasal flap Rieger"},{term:"East\u2013west flap",also:["East\u2013west (horizontal advancement) flap","east-west"],def:"A horizontal advancement flap for small defects of the nasal tip: a standing cone is removed above the defect, a second one beside the columella or ala, and the skin slides sideways."},{term:"A\u2013T and O\u2013T closure",also:["O\u2013T","A\u2013T","O\u2013T / A\u2013T"],def:"A bilateral advancement flap. The defect (round 'O' or triangular 'A') is closed by sliding skin in from both sides along a straight line at its base, leaving a T-shaped scar whose bar can be hidden at a hairline, brow or crease."},{term:"O\u2013Z closure",also:["O\u2013Z"],def:"Two rotation flaps taken from opposite sides of a round defect and rotated in the same direction, leaving a Z- or S-shaped scar. Useful on the scalp and temple."},{term:"H-plasty",def:"Advancement flaps raised on both sides of a defect and slid towards each other, leaving an H-shaped scar. Typical on the forehead and brow."},{term:"Pinwheel flap",also:["pinwheel"],def:"Three or four small curved rotation flaps arranged around a round defect, all turning the same way, to close stiff scalp skin."},{term:"Cheek advancement flap",also:["cheek advancement","Cheek advancement (Burow's) flap"],def:"Lax cheek skin slid medially to cover a defect of the medial cheek or nasal sidewall, with the redundant triangles removed in the nasofacial sulcus, the melolabial fold or along the lower eyelid."},{term:"Mustard\xE9 flap",also:["Mustard\xE9","Mustard\xE9 cheek rotation","cheek rotation"],def:"A large cheek rotation flap whose incision runs from the defect along the lower lid, up over the lateral canthus and down in front of the ear. Used for big lower-eyelid and infraorbital defects."},{term:"Cervicofacial flap",def:"A large rotation-advancement flap that recruits lax skin of the lower cheek and neck to cover big cheek defects."},{term:"Keystone flap",also:["keystone"],def:"A curved, trapezoid island flap raised beside a defect and advanced on its underlying perforators. Popular for wounds on the lower leg and trunk."},{term:"Tenzel flap",also:["Tenzel","Tenzel semicircular flap"],def:"A semicircular skin-and-muscle flap raised from the lateral canthus and rotated medially to close eyelid margin defects of roughly a third to half of the lid.",find:"Tenzel semicircular flap eyelid"},{term:"Hughes flap",also:["Hughes","tarsoconjunctival (Hughes) flap","tarsoconjunctival"],def:"A lid-sharing flap of tarsus and conjunctiva brought down from the upper lid to rebuild the inner layer of a large lower-lid defect. The eye stays closed until the pedicle is divided a few weeks later.",find:"Hughes tarsoconjunctival flap"},{term:"Cutler\u2013Beard flap",also:["Cutler\u2013Beard"],def:"A lid-sharing flap of full-thickness lower lid advanced under the lower lid margin to rebuild a large upper-lid defect, divided at a second stage.",find:"Cutler-Beard flap"},{term:"Tripier flap",also:["Tripier"],def:"A skin-and-muscle transposition flap from the upper eyelid, turned down to resurface the lower eyelid."},{term:"Abbe flap",also:["Abbe","lip-switch","Abbe (lip-switch) flap","lip-switch flap"],def:"A full-thickness wedge of one lip rotated across the mouth into a defect of the other lip on a narrow pedicle containing the labial artery, which is divided 2\u20133 weeks later.",find:"Abbe flap lip reconstruction"},{term:"Estlander flap",also:["Estlander"],def:"A lip-switch flap like the Abbe flap, but used at the corner of the mouth, so it is done in one stage and rounds off the commissure.",find:"Estlander flap"},{term:"Karapandzic flap",also:["Karapandzic"],def:"Circumoral advancement-rotation flaps that keep the nerves and vessels of orbicularis oris intact, closing large lip defects with a mouth that still moves and feels, at the cost of a smaller opening.",find:"Karapandzic flap"},{term:"Bernard\u2013Burow flap",also:["Bernard\u2013Burow","Bernard\u2013Burow advancement","Gillies fan"],def:"Advancement of full-thickness cheek tissue towards the midline to rebuild a very large lower-lip defect, with Burow's triangles removed beside the nose and chin."},{term:"Antia\u2013Buch flap",also:["Antia\u2013Buch","helical rim advancement","Helical rim (chondrocutaneous) advancement flap","chondrocutaneous"],def:"A helical rim advancement flap: the rim is cut free from the rest of the ear through the front skin and cartilage, left attached to the skin on the back of the ear, and slid along to close a rim defect.",find:"Antia-Buch helical advancement flap"},{term:"Pull-through flap",also:["pull-through","revolving-door","revolving door","Postauricular pull-through (revolving-door) island flap"],def:"An island of skin from behind the ear, left attached to the tissue beneath it, passed through a window in the conchal cartilage to resurface the front of the conchal bowl."},{term:"Wedge excision",also:["wedge","wedge excisions"],def:"Removing a full-thickness V-shaped piece of a lip, ear or eyelid and closing it directly in layers. How much can go depends on tissue laxity: roughly a third of a lip, a quarter of an eyelid."},{term:"Vermilionectomy",also:["lip shave"],def:"Removing the whole vermilion of the lower lip down to muscle, for widespread actinic cheilitis or superficial carcinoma. The defect is covered by advancing the labial mucosa (a mucosal advancement flap)."},{term:"Mucosal advancement flap",also:["mucosal advancement"],def:"Undermining the wet mucosa inside the lip and pulling it forward to make a new vermilion."},{term:"Ectropion",def:"The eyelid margin turning outward, away from the globe. After surgery it comes from downward pull on the lower lid, especially when the lid is lax. It causes tearing, irritation and corneal exposure."},{term:"Lagophthalmos",def:"Inability to close the eyelids completely, from a tight upper lid or weakness of orbicularis oculi. The exposed cornea dries and can ulcerate."},{term:"Epiphora",def:"Watering of the eye because tears cannot drain, for example after injury to a canaliculus or when the punctum is pulled away from the globe."},{term:"Telecanthus",def:"Widening of the distance between the inner corners of the eyes, which happens when the medial canthal tendon is cut and not re-attached."},{term:"Tarsus",also:["tarsal plate","tarsal"],def:"The plate of dense connective tissue that stiffens each eyelid \u2014 about 10 mm tall in the upper lid and 4 mm in the lower. With the conjunctiva it forms the lid's posterior lamella."},{term:"Lamella",also:["lamellae","anterior lamella","posterior lamella"],def:"The eyelid is repaired in two layers: the anterior lamella (skin and orbicularis muscle) and the posterior lamella (tarsus and conjunctiva). A full-thickness defect needs both rebuilt, and at least one of them must bring its own blood supply."},{term:"Canthotomy and cantholysis",also:["canthotomy","cantholysis"],def:"Cutting through the lateral canthus (canthotomy) and then dividing the lower or upper limb of the lateral canthal tendon (cantholysis). This frees the lid to slide medially by several millimetres so a margin defect can be closed directly.",find:"lateral canthotomy cantholysis"},{term:"Canthopexy and tarsal strip",also:["canthopexy","tarsal strip","lateral canthopexy"],def:"Procedures that tighten a lax lower lid by re-anchoring the lateral canthal tendon (canthopexy) or a strip of the tarsus itself (tarsal strip) to the periosteum inside the lateral orbital rim. They are added to a repair to prevent ectropion."},{term:"Snap-back and distraction tests",also:["snap-back","distraction tests","snap-back test"],def:"Bedside tests of lower-lid laxity. Pull the lid down and let go: it should snap back at once without a blink. Pull it forward: more than about 6\u20138 mm off the globe is lax. A lax lid is likely to develop ectropion after surgery."},{term:"Frost suture",def:"A temporary suture from the lower lid margin taped or stitched to the brow, holding the lid up on stretch for a few days to counter swelling and scar contraction."},{term:"Levator aponeurosis",def:"The tendon of the muscle that raises the upper eyelid. It fans out into the upper tarsus and the skin of the lid crease; if it is cut the lid droops (ptosis)."},{term:"Orbital septum",def:"The thin fibrous sheet running from the orbital rim into the eyelid, holding the orbital fat back. Fat appearing in an eyelid wound means the septum has been breached."},{term:"Punctum and canaliculus",also:["canaliculi","canaliculus","puncta","punctum"],def:"Tears enter a small opening (punctum) near the inner end of each lid margin and run through a fine tube (canaliculus) in the margin to the lacrimal sac. A cut canaliculus is repaired over a stent to prevent a permanently watery eye.",find:"lacrimal canaliculus laceration"},{term:"Medial canthal tendon",def:"The fibrous band anchoring the inner ends of both eyelids to the bone beside the nose. The lacrimal sac sits just behind it."},{term:"Whitnall's tubercle",def:"A small bony bump just inside the lateral orbital rim where the lateral canthal tendon attaches. Repairs re-anchor the lid to the periosteum here."},{term:"Internal nasal valve",also:["internal valve"],def:"The narrowest part of the nasal airway, between the septum and the lower edge of the upper lateral cartilage, under the lower sidewall. Pulling or pushing the sidewall inward here blocks breathing on that side."},{term:"External nasal valve",also:["external valve"],def:"The nostril opening itself, framed by the ala, columella and sill. A weak or scarred ala collapses inward on breathing in."},{term:"Alar groove",also:["alar crease","alar-facial sulcus","nasofacial sulcus"],def:"The creases that outline the nose: the alar groove (crease) curves over the top of the ala, the alar-facial sulcus separates ala from cheek, and the nasofacial sulcus separates sidewall from cheek. They hide scars well but are flattened by any flap that crosses them."},{term:"Rhinion",def:"The point on the nasal dorsum where the nasal bones meet the cartilage. The skin is thinnest here."},{term:"Vestibular stenosis",def:"Narrowing of the nostril by scar after a wound that runs around its circumference."},{term:"Vibrissae",def:"The coarse hairs just inside the nostril."},{term:"Vermilion",also:["vermilion border","vermilion\u2013cutaneous junction"],def:"The red part of the lip. Its sharp junction with the skin (the vermilion border) must be re-aligned exactly \u2014 a 1 mm step is visible \u2014 so it is marked with ink before local anaesthetic blurs it."},{term:"Wet\u2013dry line",def:"The line on the lip where the dry outer vermilion meets the moist inner mucosa, roughly where the lips touch."},{term:"Cupid's bow",def:"The double curve of the upper vermilion border beneath the philtrum."},{term:"Philtrum",also:["philtral columns","philtral column","philtral"],def:"The central groove of the upper lip, bounded by two vertical ridges (philtral columns). It is a cosmetic subunit in its own right."},{term:"Oral commissure",also:["commissure"],def:"The corner of the mouth, where the upper and lower lips meet."},{term:"Microstomia",def:"An abnormally small mouth opening, which can follow lip reconstruction that borrows tissue from the remaining lip."},{term:"Chondritis",def:"Inflammation or infection of cartilage. On the ear it is painful, slow to settle and can destroy the cartilage framework; keeping exposed cartilage covered and moist helps prevent it."},{term:"Tragal pointer",def:"The medial tip of the tragal cartilage, which points towards the main trunk of the facial nerve about 1 cm deeper and slightly below it."},{term:"Arnold's nerve",also:["Arnold's n.","auricular branch of the vagus"],def:"The auricular branch of the vagus nerve, supplying the conchal bowl and part of the ear canal. Stimulating it can trigger coughing or fainting."},{term:"Ring block",also:["ring-block"],def:"Local anaesthetic infiltrated in a ring around the base of a structure (ear, nose, digit, scalp lesion) to numb everything beyond it."},{term:"Fissures of Santorini",def:"Natural gaps in the cartilage of the outer ear canal through which tumour or infection can spread forward into the parotid."},{term:"Pitanguy's line",def:"A line from 0.5 cm below the tragus to 1.5 cm above the outer end of the eyebrow. It marks the course of the temporal branch of the facial nerve across the temple."},{term:"Erb's point",def:"The spot at about the middle of the back edge of sternocleidomastoid where the cutaneous nerves of the neck emerge. The spinal accessory nerve comes out within 1\u20132 cm above it and crosses the posterior triangle just under the skin.",find:"Erb's point spinal accessory nerve"},{term:"McKinney's point",def:"The point on the middle of sternocleidomastoid, 6.5 cm below the ear canal, where the great auricular nerve crosses the muscle."},{term:"Seckel's danger zones",also:["Seckel zone","Seckel"],def:"Seven areas of the face, described by Brooke Seckel, where a nerve lies superficially enough to be cut during facial surgery: great auricular, temporal, marginal mandibular, zygomatic and buccal, supraorbital and supratrochlear, infraorbital, and mental.",find:"facial danger zones"},{term:"Posterior triangle",also:["posterior triangle of the neck"],def:"The area of the side of the neck between the back edge of sternocleidomastoid, the front edge of trapezius and the clavicle. The spinal accessory nerve crosses it with very little cover.",find:"posterior triangle of the neck"},{term:"Stensen's duct",also:["parotid duct","Stensen"],def:"The duct carrying saliva from the parotid gland across the cheek to open inside the mouth opposite the upper second molar."},{term:"Antegonial notch",also:["anterior edge of masseter","anterior border of masseter"],def:"The shallow dip on the lower border of the mandible just in front of the masseter muscle, where the facial artery pulse can be felt and the marginal mandibular nerve crosses."},{term:"Mastoid",also:["mastoid tip","mastoid process"],def:"The bony prominence behind the earlobe. Sternocleidomastoid attaches to it, and the facial nerve leaves the skull just in front of it."},{term:"Anatomical snuffbox",also:["snuffbox"],def:"The hollow on the thumb side of the back of the wrist, seen when the thumb is extended. The radial artery crosses its floor and the superficial radial nerve and cephalic vein cross its roof."},{term:"Kaplan's cardinal line",also:["Kaplan's line"],def:"A line drawn across the palm from the first web space towards the hook of the hamate, used to locate the recurrent motor branch of the median nerve and the palmar arches."},{term:"Guyon's canal",def:"The tunnel on the little-finger side of the wrist, beside the pisiform bone, through which the ulnar nerve and artery enter the hand."},{term:"Carpal tunnel",def:"The tunnel at the wrist, under the flexor retinaculum, carrying the median nerve and the finger flexor tendons into the hand."},{term:"Cubital tunnel",def:"The groove behind the medial epicondyle of the elbow ('funny bone') where the ulnar nerve lies directly under the skin."},{term:"Tarsal tunnel",def:"The tunnel behind the medial malleolus, under the flexor retinaculum, carrying the tibial nerve and posterior tibial vessels into the foot."},{term:"Femoral triangle",def:"The area at the top of the front of the thigh, below the inguinal ligament, containing the femoral nerve, artery and vein (lateral to medial) and the inguinal lymph nodes."},{term:"Popliteal fossa",def:"The diamond-shaped hollow behind the knee containing the popliteal vessels and the tibial and common peroneal nerves."},{term:"Sappey's line",def:"A line around the trunk from just above the umbilicus to the L2 vertebra. Skin above it tends to drain to the axillary nodes and skin below it to the inguinal nodes; near the line, and near the midline, drainage is unpredictable."},{term:"First-echelon nodes",also:["first-echelon","first echelon"],def:"The first group of lymph nodes that a patch of skin drains to \u2014 the nodes to examine when following a patient with squamous cell carcinoma or melanoma at that site."},{term:"Neck node levels",also:["level II","level V","level Ia","level Ib","levels I\u2013IV","levels II\u2013IV","level I"],def:"Neck lymph nodes are grouped by level: I submental (Ia) and submandibular (Ib); II, III and IV upper, middle and lower jugular chain; V posterior triangle; VI central compartment.",find:"cervical lymph node levels"},{term:"Epitrochlear node",also:["epitrochlear"],def:"A lymph node on the inner side of the arm just above the elbow, draining the ulnar side of the hand and forearm."},{term:"Lymphocele",def:"A collection of lymph in a wound after lymphatic channels are cut, most often in the groin or axilla."},{term:"Sialocele",also:["salivary fistula","salivary\u2013cutaneous fistula"],def:"A collection of saliva under the skin after injury to the parotid gland or duct. If it drains through the wound it becomes a salivary fistula."},{term:"Neuroma",also:["neuromas"],def:"A tender knot of disorganised nerve fibres that forms at the cut end of a nerve. It causes sharp, electric pain when touched or knocked."},{term:"Dysaesthesia",also:["dysesthesia","paraesthesia"],def:"Unpleasant abnormal sensation \u2014 burning, tingling or crawling \u2014 in the territory of an injured sensory nerve."},{term:"Pseudoaneurysm",def:"A pulsating blood-filled swelling that forms when a hole in an artery is contained only by the surrounding tissue. It can follow a partly cut superficial temporal artery."},{term:"Brow ptosis",also:["ptosis"],def:"Drooping. Brow ptosis follows injury to the temporal branch of the facial nerve; eyelid ptosis follows injury to the levator muscle or its aponeurosis."},{term:"Winged scapula",def:"The shoulder blade lifting off the chest wall. After spinal accessory nerve injury the paralysed trapezius lets the shoulder droop and the scapula rotate outward."},{term:"Mallet finger",also:["mallet","mallet deformity"],def:"A fingertip that droops and cannot be straightened, caused by division of the extensor tendon where it attaches to the last finger bone."},{term:"Foot drop",def:"Inability to lift the front of the foot, so the toes drag when walking. It follows injury to the common peroneal nerve."},{term:"Meralgia paraesthetica",def:"Burning, tingling or numbness of the outer thigh from compression or injury of the lateral femoral cutaneous nerve."},{term:"Vasovagal episode",also:["vasovagal"],def:"A faint: a reflex drop in heart rate and blood pressure causing pallor, sweating, nausea and brief loss of consciousness."},{term:"Dehiscence",def:"A sutured wound coming apart, from tension, movement, infection or bleeding beneath it."},{term:"Contracture",also:["scar contracture","contract into bands"],def:"Shortening of a scar that restricts movement or distorts nearby structures, typical of straight scars crossing joint creases."},{term:"Allen's test",def:"A bedside check that the hand can survive on one of its two arteries: compress both radial and ulnar arteries, have the patient clench to blanch the hand, then release one artery and watch colour return within a few seconds."},{term:"Nail matrix",also:["matrix"],def:"The tissue under the proximal nail fold that produces the nail plate. Damage to it causes permanent nail deformity."},{term:"Lunula",def:"The pale half-moon at the base of the nail: the visible, most distal part of the matrix."},{term:"Eponychium",def:"The undersurface of the proximal nail fold, lying on the new nail. The term is often used loosely for the cuticle."},{term:"Hyponychium",def:"The skin under the free edge of the nail that seals the nail bed to the fingertip."},{term:"Onycholysis",def:"Separation of the nail plate from the nail bed, starting at the free edge; the detached part looks white or yellow."},{term:"Longitudinal melanonychia",also:["melanonychia","pigmented band"],def:"A brown or black stripe running the length of the nail, produced by pigment-making cells in the matrix. Most are benign, but a wide, dark, irregular or changing band in one nail needs a matrix biopsy to exclude melanoma.",find:"longitudinal melanonychia"},{term:"Erythronychia",def:"A red stripe running the length of the nail. In a single nail it may mark a benign tumour (onychopapilloma, glomus tumour) or squamous cell carcinoma."},{term:"Hutchinson's sign",def:"Pigment spreading from a pigmented nail band on to the skin of the nail folds \u2014 a warning sign of subungual melanoma."},{term:"Matricectomy",def:"Destroying or removing part or all of the nail matrix, surgically or with phenol, so that part of the nail does not regrow. Used for ingrown toenails."},{term:"Digital block",also:["transthecal"],def:"Anaesthesia of a whole finger or toe by injecting at its base: either into the web space on each side to reach the digital nerves, or as a single palmar injection into the flexor tendon sheath (transthecal).",find:"digital nerve block"},{term:"Myxoid cyst",also:["Digital myxoid (mucous) cysts","digital myxoid cyst","digital myxoid cysts","mucous cyst"],def:"A small jelly-filled cyst on the back of the fingertip near the nail, connected to the end joint of the finger and usually associated with osteoarthritis. It can press a groove into the nail."},{term:"En bloc excision",also:["en bloc","en bloc nail-unit excision"],def:"Removing a structure in one piece. En bloc nail-unit excision takes the nail folds, matrix and bed off the bone together, as a tissue-sparing alternative to amputation for nail tumours that have not reached bone."},{term:"Bruner incision",also:["Bruner","mid-lateral","Bruner zig-zag"],def:"Incisions designed to avoid a straight scar a

p-post-axilla":{like:"trunk",lymph:"Axillary nodes."},"bp-thoracic":{like:"bp-interscap",lymph:"Axillary nodes, either side."},"bp-midback":{like:"bp-interscap",lymph:"Axillary nodes."},"bp-post-flank":{like:"trunk",lymph:"Axillary nodes above the L2 level, inguinal nodes below."},"bp-lumbar":{like:"trunk",lymph:"Watershed (Sappey's line at about L2): axillary or inguinal nodes, either side."},"bp-lowback":{like:"trunk",lymph:"Superficial inguinal nodes; axillary nodes above L2."},"bp-sacral":{like:"trunk",lymph:"Superficial inguinal nodes, either side.",notes:["Pressure- and shear-bearing skin over bone: off-load after surgery."]},"bp-natal-cleft":{like:"trunk",auc:"H",aucNote:"if perianal / perineal",lymph:"Superficial inguinal nodes, either side.",notes:["Moist, sheared, contaminated site: dehiscence and infection are common. Off-midline closure heals better than a midline scar in the cleft."]},"bp-perianal":{like:"ba-pubic",notes:["The external anal sphincter lies just under the perianal skin; circumferential excision risks stenosis.","Lesions crossing the anal verge need anoscopy and usually colorectal input.","Secondary intention heals well here."]},"bp-buttock":{like:"trunk",lymph:"Superficial inguinal nodes.",notes:["Weight-bearing: sitting stresses the wound. Close along the gluteal fold lines and use strong buried sutures.","The sciatic nerve is deep to gluteus maximus and not at risk in skin surgery."]},limb:{auc:"L",plane:"Deep subcutaneous fat above the muscular fascia; cutaneous nerves and superficial veins run in the deep fat.",notes:["Relaxed skin tension lines on the limbs are often oblique or circumferential; longitudinal closures are sometimes preferred because they follow the lymphatics and are easier to close \u2014 pinch the skin to decide.","Avoid closing across joints in the line of flexion."],repair:["Primary fusiform closure.","Secondary intention.","Split- or full-thickness skin graft."]},"ba-deltoid":{like:"limb",alerts:["Shoulder scars spread and commonly become hypertrophic or keloidal."],lymph:"Axillary nodes.",sensory:"Supraclavicular nn. (C3\u2013C4) over the top; upper lateral cutaneous n. of arm (axillary n., C5).",notes:["High-tension, mobile site: use strong buried sutures and restrict reaching and lifting for 2\u20133 weeks.","The axillary nerve is deep to deltoid, about 5 cm below the acromion \u2014 not at risk in skin surgery."]},"bp-post-shoulder":{like:"ba-deltoid"},"ba-uparm":{like:"limb",lymph:"Axillary nodes.",sensory:"Upper and lower lateral cutaneous nn. of arm (lateral); medial cutaneous n. of arm and intercostobrachial n. (medial)."},"ba-med-uparm":{like:"limb",lymph:"Axillary nodes; epitrochlear node just above the medial epicondyle.",sensory:"Medial cutaneous n. of arm; intercostobrachial n. (T2).",notes:["Thin, lax skin. The basilic vein and medial antebrachial cutaneous nerve pierce the fascia in the middle of the medial arm; the brachial artery, median and ulnar nerves lie just beneath the fascia in the bicipital groove."]},"bp-post-uparm":{like:"limb",lymph:"Axillary nodes.",sensory:"Posterior cutaneous n. of arm (radial n.)."},"ba-antecub":{like:"limb",structures:["b-antecubital"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Medial and lateral antebrachial cutaneous nn."},"bp-elbow":{like:"limb",structures:["b-ulnar-elbow"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Posterior cutaneous n. of forearm; medial antebrachial cutaneous n.",notes:["Skin over the olecranon is lax in extension and tight in flexion \u2014 close with the elbow partly flexed.","The olecranon bursa lies just under the skin; entering it risks a chronic sinus.","High dehiscence risk: consider splinting in the first week."]},"ba-volar-forearm":{like:"limb",lymph:"Axillary nodes; epitrochlear node (ulnar side).",sensory:"Medial and lateral antebrachial cutaneous nn.",notes:["Thin skin with visible veins; actinic damage is usually less than on the dorsal side."]},"bp-dorsal-forearm":{like:"limb",lymph:"Axillary nodes; epitrochlear node (ulnar side).",sensory:"Posterior cutaneous n. of forearm (radial n.); lateral and medial antebrachial cutaneous nn. at the edges.",structures:["b-radial-sensory"],notes:["Atrophic, sun-damaged skin tears easily in the elderly: use wide, shallow bites, pulley or horizontal mattress sutures, and adhesive strips to reinforce.","Closure in the long axis of the forearm is often easiest; second-intention healing and grafts also do well."]},"ba-volar-wrist":{like:"limb",structures:["b-volar-wrist","b-radial-sensory"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Palmar cutaneous branches of the median and ulnar nn.; lateral antebrachial cutaneous n.",plane:"Just beneath the dermis.",notes:["Close transversely in the wrist creases; longitudinal scars across the crease contract."]},"bp-dorsal-wrist":{like:"limb",structures:["b-radial-sensory","b-dorsal-hand"],lymph:"Axillary nodes; epitrochlear node.",sensory:"Superficial radial n. (radial side), dorsal branch of ulnar n. (ulnar side).",plane:"Just beneath the dermis, above the veins and the extensor retinaculum."},hand:{auc:"H",lymph:"Epitrochlear node (ulnar side) and axillary nodes.",plane:"Just beneath the dermis.",notes:["Function comes first: plan closures that do not limit joint movement, and splint or bulky-dress for comfort.","Elevate after surgery; oedema is the main cause of pain and stiffness."],repair:["Primary closure along skin creases.","Secondary intention.","Full-thickness graft."]},"bp-dorsal-hand":{like:"hand",structures:["b-dorsal-hand","b-radial-sensory"],sensory:"Superficial radial n. (radial), dorsal branch of ulnar n. (ulnar).",notes:["Thin, mobile skin over veins and extensor tendons; test closure with the fist clenched.","Transverse or oblique closures follow the skin lines; preserve paratenon if a graft may be needed.","Squamous cell carcinoma here is common and often multiple in the immunosuppressed."]},"ba-palm":{like:"hand",structures:["b-volar-wrist","b-digital"],sensory:"Median n. (radial three and a half digits and palm), ulnar n. (ulnar one and a half); palmar cutaneous branches proximally.",plane:"Above the palmar aponeurosis. Glabrous skin is tethered by fibrous septa and barely undermines.",notes:["The recurrent motor branch of the median nerve is superficial at the base of the thenar eminence.","The superficial palmar arch lies level with the distal border of the outstretched thumb.","Incisions should follow or zig-zag across the flexion creases, never cross them at right angles."],repair:["Secondary intention \u2014 glabrous skin heals well.","Primary closure along creases.","Full-thickness graft (hypothenar or instep skin for glabrous match)."]},"ba-thumb":{like:"hand",auc:"H",structures:["b-digital","b-radial-sensory"],sensory:"Median n. (palmar) and superficial radial n. (dorsal); digital nerves on each side.",notes:["Preserve length and pulp sensation above all.","For nail-unit tumours, bone lies 1\u20132 mm below the nail bed; en bloc nail-unit excision with full-thickness graft is the usual tissue-sparing option."]},"ba-fingers":{like:"hand",structures:["b-digital"],sensory:"Proper palmar digital nn. (median: thumb to radial half of ring finger; ulnar: ulnar half of ring and little finger).",notes:["Use mid-lateral or Bruner zig-zag incisions on the palmar side; never a straight line across a flexion crease.","Digital block: adrenaline-containing lidocaine is considered safe in digits with normal circulation; keep volumes small (2\u20133 mL) and tourniquet time short."]},"bp-dorsal-fingers":{like:"hand",aucNote:"includes the nail unit",structures:["b-digital","b-dorsal-hand"],sensory:"Dorsal digital nn. (radial and ulnar) proximally; palmar digital nn. supply the dorsum distal to the PIP joint and the nail unit.",notes:["Nail unit: the matrix lies under the proximal nail fold and extends to within a few millimetres of the DIP joint; its proximal (dorsal) part makes the surface of the plate, so matrix scars cause split or ridged nails.","The extensor tendon inserts about 1.2 cm proximal to the cuticle. Bone is 1\u20132 mm under the nail bed.","Longitudinal melanonychia or erythronychia with nail dystrophy in one digit: think of nail-unit squamous cell carcinoma or melanoma."],repair:["Secondary intention (including the nail bed and lateral folds).","Full-thickness graft after en bloc nail-unit excision.","Primary closure; cross-finger and local flaps for exposed tendon or bone (hand surgery)."]},"nail-unit":{like:"hand",aucNote:"nail unit",alerts:["Bone lies 1\u20132 mm beneath the nail bed and matrix; the extensor tendon inserts just proximal to the matrix."],structures:["b-digital"],lymph:"Fingers: epitrochlear node (ulnar digits) and axillary nodes. Toes: superficial inguinal nodes.",sensory:"Proper palmar (plantar) digital nn., via their dorsal branches. A digital block at the base of the digit anaesthetises the whole nail unit.",artery:"Paired digital arteries forming the proximal and distal arcades in the nail bed.",plane:"None \u2014 nail bed and matrix dermis attach directly to the periosteum of the distal phalanx.",notes:["Parts: proximal nail fold and cuticle, matrix (the lunula is its visible distal part), nail bed, hyponychium, lateral nail folds.","The matrix extends about 5 mm proximal to the cuticle, to within a few millimetres of the extensor tendon insertion and the DIP joint.","The proximal matrix forms the surface of the plate and the distal matrix its underside: biopsy the distal matrix where possible, orient matrix excisions transversely, and keep longitudinal matrix defects under 3 mm to avoid a split nail.","Nail bed biopsies are oriented longitudinally.","A single-digit longitudinal pigmented band that is wide, dark, irregular or spreading on to the nail fold (Hutchinson's sign), or a persistent wart-like or oozing lesion, needs a matrix or bed biopsy."],repair:["Secondary intention for the nail bed and lateral folds.","En bloc nail-unit excision down to periosteum, repaired with a full-thickness skin graft or left to granulate.","Amputation is reserved for bone involvement."]},"nu-proximal-fold":{like:"nail-unit",alerts:["The extensor tendon inserts about 12 mm proximal to the cuticle \u2014 incisions and injections proximal to the fold are close to it."],notes:["A wedge of skin whose undersurface (eponychium) lies on the newly formed plate and covers the proximal matrix.","To expose the matrix, make oblique relaxing incisions at the junctions of the proximal and lateral folds and reflect the fold proximally.","A crescentic full-thickness excision of the free edge of the fold (for chronic paronychia or small tumours) heals well by secondary intention.","Common site of digital myxoid cysts, which connect to the DIP joint and press a groove into the plate."],repair:["Secondary intention.","Replace the reflected fold and suture the relaxing incisions.","Full-thickness graft for larger defects."]},"nu-cuticle":{like:"nail-unit",alerts:[],notes:["A layer of keratin from the proximal nail fold that seals the fold to the plate.","Loss of the seal (trauma, manicuring, wet work) lets irritants and organisms in: chronic paronychia.","Pigment extending on to the cuticle or fold from a pigmented band is Hutchinson's sign."],repair:["Re-forms as the fold heals; protect from wet work meanwhile."]},"nu-lateral-fold":{like:"nail-unit",alerts:[],notes:["The lateral horns of the matrix extend proximally and laterally beneath the junction of the proximal and lateral folds \u2014 they must be included in a matricectomy or a spicule regrows.","Lateral longitudinal excision (fold, plate edge, bed and matrix horn down to bone, 3\u20134 mm wide) is the standard biopsy for lesions in the lateral third of the nail.","The digital nerve and artery run just palmar to the fold."],repair:["Secondary intention.","Suture the fold back to the plate edge after lateral longitudinal excision."]},"nu-matrix":{like:"nail-unit",alerts:["Matrix scars cause permanent nail dystrophy: a split from the proximal matrix, a thin or ridged plate from the distal matrix."],notes:["The matrix makes the plate. It starts just distal to the extensor tendon insertion, lies under the proximal nail fold, and ends at the distal edge of the lunula.","The proximal matrix forms the top of the plate and the distal matrix (lunula) its underside \u2014 so distal-matrix biopsies leave least deformity.","Punch biopsies up to 3 mm heal without a split; orient excisions transversely (parallel to the lunula border).","For longitudinal melanonychia, find the origin of the band in the matrix: a tangential (shave) matrix biopsy samples a wide band with little dystrophy.","Matrix melanocytes are mostly dormant; activation gives a longitudinal pigmented band."],repair:["Leave punch defects up to 3 mm to heal.","Close transverse matrix defects with fine absorbable sutures after undermining.","Replace the plate as a biological dressing."]},"nu-bed":{like:"nail-unit",alerts:["Bone is 1\u20132 mm beneath the bed, with no subcutaneous fat between."],notes:["The bed holds the plate down by interlocking longitudinal ridges; it adds little to plate thickness.","Orient bed biopsies longitudinally. Punches up to 4 mm and narrow longitudinal ellipses heal by secondary intention.","Scarring of the bed causes onycholysis rather than a split.","A persistent warty, oozing or onycholytic lesion of one nail should be biopsied for squamous cell carcinoma; image the phalanx if the bed is involved."],repair:["Secondary intention.","Fine absorbable sutures for longitudinal defects.","Full-thickness graft after en bloc nail-unit excision."]},"nu-plate":{like:"nail-unit",alerts:[],structures:[],notes:["Fingernails grow about 3 mm a month (full regrowth in about 6 months); toenails about 1 mm a month (12\u201318 months for the great toenail).","Partial avulsion (lateral, proximal or a trap-door) gives access with less morbidity than total avulsion.","Separate the plate from the bed and from the proximal fold with a blunt elevator before lifting it.","A punch through the softened plate (two-punch technique) reaches the bed or matrix without avulsion."],repair:["Replace the trimmed plate as a splint and dressing where possible."]},"nu-hyponychium":{like:"nail-unit",alerts:[],notes:["The seal between the distal nail bed and the fingertip, under the free edge; the onychodermal band marks its proximal limit.","Disrupting it causes onycholysis and lets organisms under the plate.","Subungual warts and squamous cell carcinoma often start here or in the lateral groove."],repair:["Secondary intention."]},"nu-pulp":{like:"nail-unit",aucNote:"hand / foot",alerts:[],plane:"Fat is divided into compartments by fibrous septa running from the dermis to the periosteum; undermining is limited.",notes:["Each digital nerve ends by dividing into three branches just distal to the DIP crease, supplying the pulp, the nail bed and the dorsal tip.","The digital arteries join in an arcade over the tuft of the phalanx.","Preserve pulp sensation and padding: glabrous skin heals well by secondary intention."],repair:["Secondary intention (defects up to about 1 cm without exposed bone).","Full-thickness graft from the hypothenar eminence.","V\u2013Y advancement or other local flaps for exposed bone (hand surgery)."]},"nu-phalanx":{like:"nail-unit",structures:[],notes:["The matrix and bed lie directly on the periosteum of the distal phalanx.","X-ray before surgery for subungual tumours: look for exostosis, erosion or invasion.","Bone involvement by squamous cell carcinoma or melanoma usually means amputation at or proximal to the DIP joint."],repair:[]},"nu-extensor":{like:"nail-unit",alerts:["Dividing the terminal extensor tendon causes a mallet (dropped) fingertip."],structures:[],notes:["Inserts on the dorsal base of the distal phalanx about 12 mm proximal to the cuticle; the proximal edge of the matrix is about 1 mm distal to the insertion.","Only skin and paratenon cover it over the DIP joint."],repair:["A divided tendon needs splinting in extension or repair \u2014 hand surgery."]},"nu-dip":{like:"nail-unit",aucNote:"hand / foot",alerts:["The joint capsule and extensor tendon lie directly under thin dorsal skin."],notes:["Digital myxoid (mucous) cysts arise from the DIP joint, usually over an osteophyte; surgery must deal with the stalk to the joint.","Entering the joint risks septic arthritis.","Close dorsal wounds with the joint extended, or accept secondary intention."],repair:["Secondary intention.","Full-thickness graft over intact paratenon.","Local rotation or transposition flap for exposed tendon or joint."]},leg:{like:"limb",lymph:"Superficial inguinal nodes.",notes:["Healing is slower below the knee: more dehiscence, infection and prolonged oedema. Elevate and compress after surgery.","Check pulses, venous disease and oedema before choosing between closure, graft and secondary intention."]},"ba-ant-thigh":{like:"leg",sensory:"Anterior cutaneous branches of the femoral n.; lateral femoral cutaneous n. laterally.",notes:["Thick fat and a good blood supply: primary closure is usually straightforward."]},"ba-med-thigh":{like:"leg",structures:["b-femoral","b-saphenous"],sensory:"Obturator n. and medial cutaneous branches of the femoral n.",notes:["The great saphenous vein runs up the medial thigh in the subcutaneous fat to the saphenofemoral junction.","Thin, lax skin; friction and moisture increase wound problems."]},"ba-lat-thigh":{like:"leg",sensory:"Lateral femoral cutaneous n. (L2\u2013L3).",notes:["The iliotibial tract lies under the fat; skin here is tight and scars spread."]},"bp-post-thigh":{like:"leg",sensory:"Posterior femoral cutaneous n. (S1\u2013S3).",notes:["Wounds are stressed by sitting; use strong buried sutures."]},"ba-knee":{like:"leg",structures:["b-peroneal","b-saphenous"],sensory:"Anterior femoral cutaneous nn.; infrapatellar branch of the saphenous n. (crosses below the patella from medial to lateral).",notes:["Skin over the patella is tight in flexion: close with the knee slightly bent and consider a splint for the first week.","The prepatellar bursa lies just beneath the skin.","Dividing the infrapatellar branch of the saphenous nerve leaves a numb patch lateral to the scar, sometimes a neuroma."]},"bp-popliteal":{like:"leg",structures:["b-popliteal","b-peroneal","b-sural"],sensory:"Posterior femoral cutaneous n.",lymph:"Popliteal nodes, then inguinal nodes."},"ba-shin":{like:"leg",auc:"M",aucNote:"pretibial surface",alerts:["Pretibial skin heals slowly and closes under high tension \u2014 plan for it."],structures:["b-saphenous","b-peroneal"],sensory:"Saphenous n. (medial); lateral sural cutaneous and superficial peroneal nn. (lateral).",plane:"Above the deep fascia. Over the tibia there is almost no fat between skin and periosteum.",notes:["Tight, thin, poorly perfused skin over bone; oedema, venous disease and anticoagulation make it worse.","Compression (Unna boot or multilayer bandaging) and elevation after surgery improve healing by any method.","Grafts fail on bare cortical bone: preserve periosteum."],repair:["Primary closure in the long axis of the leg, often needing wide undermining above the fascia.","Secondary intention with compression \u2014 slow but reliable for small and medium wounds.","Purse-string or partial closure to shrink the wound.","Split- or full-thickness (including pinch) grafts; keystone or bilateral advancement flaps for selected defects."]},"ba-lat-leg":{like:"ba-shin",auc:"L",aucNote:"",alerts:[],structures:["b-peroneal","b-dorsal-foot"],sensory:"Lateral sural cutaneous n.; superficial peroneal n. (becomes subcutaneous in the distal third of the lateral leg).",plane:"Above the deep fascia."},"bp-calf":{like:"leg",structures:["b-sural","b-popliteal"],sensory:"Medial and lateral sural cutaneous nn.; saphenous n. medially.",lymph:"Superficial inguinal nodes; popliteal nodes (posterolateral ca
